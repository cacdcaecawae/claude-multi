<script>
// the look, 跟随系统 (the default) / 亮色 / 暗色, kept in this browser; set before anything is drawn (no dark flash)
const LOOK = matchMedia('(prefers-color-scheme: light)');
function look() {
  let v = null; try { v = localStorage.getItem('cm-look'); } catch {}
  const light = v ? v === 'light' : LOOK.matches;
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  document.querySelector('meta[name=theme-color]').content = light ? '#f8f8f8' : '#181818';
  return v ?? 'auto';
}
look(); LOOK.addEventListener('change', look);
// opened from the home screen (iOS says so itself; the display-mode query may not match a page without a manifest)
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('app');
</script>

    --inputB: #cecece; --fg: #3b3b3b; --fg2: #616161; --fg3: #8b8b8b; --fgHi: #1f1f1f; --msg: #2b2b2b; --accent: #005fb8; --accentH: #0258a8;
    --accentBg: rgba(0,95,184,.1); --link: #005fb8; --green: #2e7d32; --orange: #b45f06; --red: #c42b1c; --errFg: #b42318; --tint: rgba(0,0,0,.06);

    --a1: #0066cc; --a2: #c46a00; --a3: #8e44c4; --a4: #1e8e3e; --split: #cfcfcf; --purple: #8250df; --shadow: rgba(0,0,0,.16); --lift: rgba(0,0,0,.06); --frame: #e9e9e9; --cardB: #d8d8d8; --bar: #f7f7f7; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bar); color: var(--fg); font: 13px/1.4 var(--ui); }
  /* opened from the home screen, iOS 26 makes the page shorter than the screen by the status bar (WebKit bug 301108):
     a band left empty under the bottom bar. At least the screen's height, so the page and its fixed bars reach the
     bottom; the min() keeps it as it was where the status bar takes no room (top inset 0). */
  html.app, html.app body { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); } /* body too: the input */
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  [hidden] { display: none !important; }
  #app { flex: 1; min-height: 0; display: flex; }

  /* activity bar | side bar | editor groups, a status bar under them */
  #act { width: 48px; flex: none; display: flex; flex-direction: column; align-items: center; border-right: 1px solid var(--border); background: var(--act); }
  #act .logo { margin: 6px 0 4px; color: #d97757 !important; } /* 管家: in and out of it */
  #act .logo .spark { width: 24px; height: 24px; }
  #app.butler #act .logo { background: var(--tint); }
  #app.butler #act button[data-side] { display: none; } /* a place of its own: out of it only by the spark */
  /* held to go in or out: a ring fills round the spark (let go early and it empties) */
  #act .logo { touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  #act .logo .sp { position: relative; display: grid; place-items: center; }
  #act .logo .ring { position: absolute; left: -8px; top: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  #act .logo .ring circle { fill: none; stroke: #d97757; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
  #act .logo.hold .ring circle { opacity: 1; animation: holdRing .8s linear forwards; }
  #act .logo.hold .spark { animation: spin 1.6s linear infinite; }
  @keyframes holdRing { to { stroke-dashoffset: 0; } }
  /* the way in: a circle opens from the spark onto the 管家, a big spark bursting in the middle; the way out, it closes */
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  html.vtIn::view-transition-new(root) { animation: vtOpen .7s cubic-bezier(.7, 0, .2, 1) both; }
  html.vtOut::view-transition-old(root) { z-index: 1; animation: vtOpen .55s cubic-bezier(.7, 0, .2, 1) reverse both; }
  @keyframes vtOpen { from { clip-path: circle(0 at var(--vx) var(--vy)); } to { clip-path: circle(var(--vr) at var(--vx) var(--vy)); } }
  #burst { position: fixed; left: 50%; top: 50%; width: 180px; height: 180px; margin: -90px 0 0 -90px; color: #d97757; pointer-events: none; z-index: 50; animation: burst 1s cubic-bezier(.2, .7, .2, 1) forwards; }
  @keyframes burst { 0% { transform: scale(.2) rotate(0); opacity: 0; } 30% { opacity: .85; } 100% { transform: scale(1.7) rotate(150deg); opacity: 0; } }
  /* and a warm light over it, while there */
  #app.butler { background: radial-gradient(900px 520px at 0 0, rgba(217, 119, 87, .16), transparent 70%); }
  .spark { display: block; width: 100%; height: 100%; }
  #act button { position: relative; width: 40px; height: 40px; margin: 2px 0; border-radius: 8px; display: grid; place-items: center; color: var(--fg3); }
  #act button:hover, #act button.on { color: var(--fg); }
  #app.side #act button.on { background: var(--tint); } /* the side bar's view: a soft tile, as VS Code's now */
  @media (hover: hover) { #act button:hover { background: var(--tint); } }
  #act svg { width: 24px; height: 24px; }
  #act .label { display: none; }
  #act #gear { margin-top: auto; } /* at the bottom, as VS Code's (#act button set its margin) */
  #badge { position: absolute; right: 2px; bottom: 2px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
  #side { width: var(--sideW, 300px); flex: none; display: none; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); }
  #app.side #side { display: flex; }
  .sideHead { height: 35px; flex: none; display: flex; align-items: center; padding: 0 8px 0 20px; font-size: 13px; font-weight: 600; color: var(--fgHi); }
  #sideTitle { flex: 1; }
  #sideActs { display: flex; gap: 2px; }
  .ico { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--fg2); flex: none; }
  .ico svg { width: 16px; height: 16px; }
  #view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-bottom: 16px; }
  .sash { width: 4px; margin: 0 -2px; flex: none; position: relative; z-index: 4; cursor: col-resize; transition: background .1s .1s; }
  .sash:hover, .sash.drag { background: var(--accent); }
  #app:not(.side) #sideSash { display: none; }
  body.dragging { cursor: col-resize; user-select: none; }
  body.dragging .screen { pointer-events: none; }
  @media (hover: hover) { .ico:hover { background: var(--tint); color: var(--fg); } }

  /* the side bar's lists: folding sections, two-line rows */
  .btn { background: var(--btn); border-radius: 6px; padding: 5px 12px; line-height: 18px; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn:disabled { opacity: .45; pointer-events: none; }
  @media (hover: hover) { .btn:hover { background: var(--btnH); } .btn.primary:hover { background: var(--accentH); } }
  details.sec + details.sec { margin-top: 6px; }
  details.sec + details.sec::before { content: ''; display: block; height: 1px; margin: 0 14px 4px; background: var(--border); }
  details.sec > summary { color: var(--fg2); letter-spacing: .03em; list-style: none; height: 26px; display: flex; align-items: center; gap: 2px; padding: 0 14px 0 6px; font-size: 12px; font-weight: 600; cursor: pointer; user-select: none; }
  details.sec > summary::-webkit-details-marker, details.tools summary::-webkit-details-marker { display: none; }
  details.sec > summary::before, details.tools summary::before { content: ''; width: 16px; height: 16px; flex: none; background: currentColor;
    -webkit-mask: var(--chev) center / 16px no-repeat; mask: var(--chev) center / 16px no-repeat; transition: transform .1s; }
  details[open] > summary::before { transform: rotate(90deg); }
  details.sec > summary > span { flex: 1; }
  .count { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 8px; background: var(--badge); color: var(--badgeFg); font-size: 10px; line-height: 16px; }
  .link { color: var(--link); font-size: 11px; font-weight: 400; }
  /* rows highlight as rounded tiles inset from the side bar's edges */
  .row { display: flex; align-items: center; gap: 8px; min-height: 42px; margin: 1px 8px; padding: 4px 6px 4px 12px; border-radius: 6px; cursor: pointer; }
  .row:not([data-open]) { cursor: default; }
  .row.sel { background: var(--sel); }
  .row.open .t { color: var(--fgHi); }
  .row .main { flex: 1; min-width: 0; }
  .row { position: relative; } /* its 在右侧打开 over the time on hover: the row neither grows nor moves */
  .row .aside { display: none; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
  @media (hover: hover) { .row:hover { background: var(--hover); } .row.sel:hover { background: var(--sel); } .row:hover .aside { display: grid; } .row:hover > .when, .row:hover > .chip { visibility: hidden; } .link:hover { text-decoration: underline; } }
  .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m { font-size: 12px; color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .when { font-size: 11.5px; color: var(--fg3); flex: none; }
  /* 设置: a setting a line, its words left, its control right */
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; color: var(--fgHi); }
  .switch { width: 36px; height: 20px; flex: none; border-radius: 10px; background: var(--split); position: relative; transition: background .15s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 18px; }
  /* an account's mark: its number in a ring of its color, the ring filled clockwise as far as its 5-hour window has left */
  .ac { position: relative; width: 20px; height: 20px; flex: none; display: grid; place-items: center; font: 600 10.5px/1 var(--ui); font-style: normal; color: var(--c); }
  .ac::before { content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), color-mix(in srgb, var(--c) 22%, transparent) 0);
    -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px));
    mask: radial-gradient(closest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
  .ac.nq::before { background: none; border: 1.5px dashed color-mix(in srgb, var(--c) 60%, transparent); -webkit-mask: none; mask: none; } /* quota unread */
  .spin { width: 12px; height: 12px; flex: none; border-radius: 50%; border: 2px solid var(--orange); border-right-color: transparent; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tab .spin { margin: 0 2px; }
  .chip { font-size: 11.5px; flex: none; } /* where it runs: the status bar's green and purple, as words */
  .chip.pc { color: var(--green); }
  .chip.web { color: var(--purple); }
  .dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 11px/1 var(--ui); font-style: normal; }
  .dot.done { background: rgba(63,185,80,.2); color: var(--green); }
  .dot.ask { background: rgba(229,160,58,.2); color: var(--orange); }
  .empty { color: var(--fg3); text-align: center; padding: 20px 12px; }
  /* 对话 by folder, as Codex: a folder's icon and name, its conversations under it one line each (the account ring under
     the folder icon, the title under its name) */
  details.dir + details.dir { margin-top: 4px; }
  details.dir + details.dir::before { content: none; }
  details.dir > summary { color: var(--fg); letter-spacing: 0; font-size: 13px; font-weight: 500; height: 30px; gap: 8px; padding: 0 14px; }
  details.dir > summary::before { content: none; }
  details.dir > summary i { display: grid; color: var(--fg2); } details.dir > summary svg { width: 16px; height: 16px; }
  details.dir[open] .fc, details.dir:not([open]) .fo { display: none; }
  .row.one { min-height: 30px; padding-left: 4px; }
  .ico.on { background: var(--sel); color: var(--fgHi); }
  .ico .bdot { position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .sideHead .ico { position: relative; }

  /* 额度, 用量 in the side bar */
  /* flat, as VS Code's side bar views: sections between thin lines, no boxes */
  .panel { padding: 0 16px 0 20px; }
  .sub { color: var(--fg2); font-size: 12px; margin: 2px 0 4px; }
  h3 { font-size: 12px; font-weight: 600; color: var(--fg2); margin: 18px 0 2px; }
  .card { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .cardHead { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .meter { height: 4px; background: var(--tint); border-radius: 2px; overflow: hidden; flex: 1; }
  .meter > i { display: block; height: 100%; }
  .win { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); margin-top: 6px; }
  .win b { width: 36px; text-align: right; color: var(--fg); font-weight: 600; }
  .win span:first-child { width: 40px; }
  .win span:last-child { width: 76px; text-align: right; color: var(--fg3); }
  .renew { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--fg3); white-space: nowrap; }
  .renew svg { width: 11px; height: 11px; margin-top: -2px; }
  .renew.end { color: var(--orange); } /* renewal turned off: the day it ends */
  .rec { color: var(--green); font-size: 11.5px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; padding: 8px 0 12px; border-bottom: 1px solid var(--border); }
  .tile { padding: 4px 0; }
  .tile .k { font-size: 11.5px; color: var(--fg2); } .tile .v { font-size: 18px; font-weight: 600; color: var(--fgHi); } .tile .u { font-size: 12px; color: var(--fg2); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 120px; padding-top: 6px; }
  .bars > div { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; }
  .bars i { display: block; border-radius: 2px 2px 0 0; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg3); margin-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11.5px; color: var(--fg2); margin-top: 8px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 5px; }
  .btns { display: flex; gap: 8px; }
  .btns .btn { flex: 1; }
  .panel .btns { margin-top: 14px; }

  /* editor groups: a tab strip each, the open conversation under it */
  #editor { flex: 1; min-width: 0; display: flex; background: var(--bg); }
  .group { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .sash + .group { border-left: 1px solid var(--split); } /* groups side by side: a line between them */
  .group[data-drop]::after { content: ''; position: absolute; top: 38px; bottom: 0; left: 0; right: 0; background: rgba(0,120,212,.14);
    border: 2px solid var(--accent); pointer-events: none; z-index: 5; transition: left .08s, right .08s; }
  .group[data-drop=l]::after { right: 50%; } /* docks on the left */
  .group[data-drop=r]::after { left: 50%; }
  /* tabs with rounded tops; the shown one the conversation's color, joined to it over the strip's bottom line */
  .tabs { height: 38px; flex: none; display: flex; align-items: flex-end; padding: 0 4px 0 6px; background: var(--bar); box-shadow: inset 0 -1px var(--border); }
  .strip { flex: 1; min-width: 0; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .strip { align-self: stretch; align-items: flex-end; gap: 2px; }
  .tab { position: relative; flex: none; display: flex; align-items: center; gap: 6px; max-width: 220px; height: 32px; padding: 0 4px 0 10px;
    color: var(--fg2); border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; }
  @media (hover: hover) { .tab:not(.on):hover { background: var(--tint); } }
  .tab .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.on { background: var(--bg); color: var(--fgHi); border-color: var(--border); }
  .group:not(.focus) .tab.on { color: var(--fg2); } /* the group in focus: its shown tab's title bright, as in VS Code */
  .tab.gone .tt { opacity: .6; text-decoration: line-through; }
  .tab .ac { width: 18px; height: 18px; font-size: 10px; }
  .x { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; visibility: hidden; color: var(--fg2); }
  .x svg { width: 14px; height: 14px; }
  .tab.on .x, .x.ask, .x.done { visibility: visible; }
  /* unread, as VS Code marks an unsaved file: a dot where the × is, the × on hover */
  .tab:not(.on) .x.ask svg, .tab:not(.on) .x.done svg { display: none; } /* the shown tab keeps its ×: a phone has no hover */
  .tab.on .x::after { display: none; }
  .tab:not(.on) .x.ask::after, .tab:not(.on) .x.done::after { content: ''; width: 8px; height: 8px; border-radius: 4px; background: var(--orange); }
  .x.done::after { background: var(--green); }
  @media (hover: hover) { .tab:hover .x { visibility: visible; } .x:hover { background: var(--tint); color: var(--fg); }
    .tab:hover .x svg { display: block; } .tab:hover .x::after { display: none; } }
  .tabs > .ico { width: 30px; height: 30px; align-self: center; }
  .tabs .list, .brand { display: none; }
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .hint { display: none; margin: auto; flex-direction: column; align-items: center; gap: 14px; color: var(--fg3); text-align: center; padding: 20px; }
  .group.blank .hint { display: flex; }
  .hint .spark { width: 96px; height: 96px; color: var(--fg3); opacity: .22; margin-bottom: 4px; }
  #editor > .group:only-child [data-shut] { display: none; }

  /* 管家: its conversation alone, in place of the side bar and the groups (they stay as they were, asleep, for the
     way back): an assistant, it tells you how the others are */
  #butler { display: none; flex: 1; min-width: 0; min-height: 0; flex-direction: column; background: var(--bg); }
  #app.butler #butler { display: flex; }
  #app.butler #side, #app.butler #sideSash, #app.butler #editor { display: none !important; }
  #butler.blank > .hint { display: flex; }
  /* its 操作台, beside it: how it is, what it keeps watching, the conversations, what just got done, the computer */
  #desk { display: none; width: 260px; flex: none; flex-direction: column; gap: 18px; overflow: auto; padding: 16px 14px; background: linear-gradient(180deg, rgba(217, 119, 87, .10), transparent 200px), var(--bar); }
  /* its account and model, by its input box; and on its start page */
  .send .bsel { display: flex; gap: 6px; padding: 0 8px 6px 42px; }
  .send .bsel button { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--tint); color: var(--fg2); }
  .send .bsel button::after { content: ' ▾'; font-size: 10px; }
  @media (hover: hover) { .send .bsel button:hover { color: var(--fgHi); } }
  .hint .pickRow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .hint .pickRow > span { color: var(--fg2); margin-right: 2px; }
  .hint .pickRow .opt { color: var(--fg); }
  #app.butler #desk { display: flex; }
  #desk:empty, #desk > div:empty, #deskLine { display: none; }
  #desk h4 { margin: 0 0 6px; padding: 0 6px; font-size: 11px; font-weight: 600; color: var(--fg2); }
  #desk .me { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  #desk .me .spark { width: 34px; height: 34px; flex: none; color: #d97757; }
  #desk .me.busy .spark { animation: spin 6s linear infinite; }
  #desk .me b { font-size: 15px; color: var(--fgHi); }
  #desk .sub { font-size: 12px; color: var(--fg2); }
  #desk .mood { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding: 8px 10px; border: 1px solid var(--cardB); border-radius: 10px; background: var(--bg); color: var(--fg); }
  #desk .mood span { font-size: 18px; line-height: 1; }
  #desk .item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; min-width: 0; }
  #desk .item[data-open] { cursor: pointer; }
  #desk .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #desk .item .ad { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  #desk .item .pt { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #d97757; }
  #desk .item .when, #desk .tag { flex: none; font-size: 11px; color: var(--fg3); }
  #desk .tag.wait { color: var(--orange); font-weight: 600; }
  #desk .counts { display: flex; gap: 6px; padding: 0 6px 6px; }
  #desk .counts span { flex: 1; text-align: center; padding: 4px 0; border-radius: 6px; background: var(--tint); font-size: 11px; color: var(--fg2); }
  #desk .counts b { display: block; font-size: 15px; color: var(--fgHi); }
  #desk .counts .wait b { color: var(--orange); }
  #desk .none { padding: 0 6px; font-size: 12px; color: var(--fg3); }
  #desk .gauge { padding: 2px 6px 8px; font-size: 12px; }
  #desk .gauge .k { display: flex; justify-content: space-between; color: var(--fg2); margin-bottom: 5px; }
  #desk .meter > i { background: var(--green); transition: width .4s; }
  #desk .meter > i.warn { background: var(--orange); } #desk .meter > i.bad { background: var(--red); }
  @media (hover: hover) { #desk .item[data-open]:hover { background: var(--hover); } }
  /* the others' questions, above it: answered here, or opened */
  #asks { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 0; max-height: 50%; overflow: auto; flex: none; }
  #asks:empty { display: none; }
  #asks .from { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); padding: 0 2px 2px; }
  #asks .from b { color: var(--fgHi); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #asks .from i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  #asks .from .open { margin-left: auto; flex: none; color: var(--link); }
  .hint .bt { font-size: 18px; font-weight: 600; color: var(--fgHi); margin-top: -6px; }

  /* a conversation: where it is, the record (对话) or the terminal (终端), the input */
  .pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .pane.on { display: flex; }
  .crumbs { height: 30px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; font-size: 12px; color: var(--fg2); border-bottom: 1px solid var(--border); }
  .crumbs .path { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .crumbs .path b { font-weight: 400; color: var(--fg); }
  .crumbs .dim { color: var(--fg3); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 7px; padding: 1px; flex: none; margin-right: 2px; }
  .seg button { padding: 1px 9px; border-radius: 5px; font-size: 12px; color: var(--fg2); }
  .seg button.on { background: var(--sel); color: var(--fgHi); }
  .notice { display: none; align-items: center; gap: 10px; padding: 6px 14px; font-size: 12.5px; }
  .pane.gone .notice, .pane.idle .notice { display: flex; }
  .pane.gone .notice { background: rgba(248,81,73,.1); color: var(--errFg); }
  .pane.idle .notice { background: var(--bar); color: var(--fg2); }
  .notice span { flex: 1; }
  .screen { flex: 1; min-height: 0; overflow: auto; background: var(--term); position: relative; }
  /* a window on the computer, as text over its (hidden) terminal: the page's font, rows wrapping */
  .screen .txt { display: none; position: absolute; inset: 0; z-index: 1; overflow: auto; padding: 8px 12px 14px; background: var(--term); color: #cccccc;
    font-family: "SF Mono", Menlo, "Cascadia Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .screen.txtmode .txt { display: block; }
  .screen.txtmode { overflow: hidden; } /* the hidden terminal, a big window's size, would scroll it */
  .screen.txtmode .xterm { opacity: 0; } /* still there: the keys go to it */
  .screen .txt > div { min-height: 1.4em; }
  .screen .txt > .hr { min-height: 0; margin: .55em 0; border-top: 1px solid #444; }
  .screen .xterm { padding: 6px 2px 4px 10px; } /* on the terminal itself: the fit add-on subtracts it */
  .screen .xterm-viewport { background: var(--term) !important; } /* xterm.css paints it black; the theme colors only what's inside */
  .msgs { flex: 1; min-height: 0; overflow-y: auto; display: none; padding: 12px 20px 18px; }
  .pane.hist .msgs { display: block; }
  .pane.hist .screen, .pane.hist .keys { display: none; }
  .col { max-width: 1600px; margin: 0 auto; /* wide: your messages out to the right, Claude's to the left; capped for a huge screen */ display: flex; flex-direction: column; gap: 10px; }
  .hOld, .hNew, .live { display: contents; } /* their messages sit in the column's flow */
  .hm { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.65; color: var(--msg); } /* the conversation a size up from the frame (13px), for reading */
  .hm.user { align-self: flex-end; max-width: 85%; margin-top: 14px; background: var(--accentBg); color: var(--fgHi); border-radius: 8px 8px 2px 8px; padding: 7px 12px; }
  .hm.user.pending { opacity: .5; }
  .hm.tool { font: 12.5px/1.5 var(--mono); color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm.tool::before { content: '● '; color: var(--green); }
  .hm.note { align-self: center; font-size: 12px; color: var(--fg3); }
  .hm pre, .hm .mono { font: 13px/1.5 var(--mono); background: var(--bar); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 4px 0; }
  .hm .tbl { overflow-x: auto; margin: 4px 0; } /* sideways only when even wrapped it can't fit (a phone, many columns) */
  .hm table { border-collapse: collapse; white-space: normal; font-size: .95em; line-height: 1.55; }
  .hm th, .hm td { border: 1px solid var(--cellB); padding: 5px 10px; text-align: left; vertical-align: top; min-width: 4.5em; }
  .hm th { background: var(--bar); color: var(--fgHi); font-weight: 600; white-space: nowrap; }
  .hm code { font: .92em var(--mono); background: var(--tint); border-radius: 3px; padding: 1px 4px; }
  .hm .h { font-size: 1.08em; color: var(--fgHi); }
  .hm.done { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--green); margin: 2px 0 12px; }
  .hm.done::after { content: ''; flex: 1; height: 1px; background: var(--border); } /* the turn ends here */
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg2); margin-top: 2px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .who .took { font-weight: 400; color: var(--green); margin-left: 6px; }
  .who .spark { width: 16px; height: 16px; color: #d97757; }
  /* a turn: Claude's tool calls in a row folded into one line (tap to see each); the end of the answer marked */
  details.tools summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--fg2);
    padding: 3px 10px 3px 4px; border-radius: 6px; background: var(--tint); }
  @media (hover: hover) { details.tools summary:hover { color: var(--fg); } }
  details.tools > div { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px 7px; padding-left: 11px; border-left: 2px solid var(--border); }
  .hm.sub { font-size: 13.5px; line-height: 1.6; color: var(--fg2); } /* Claude's words on the way, inside 过程 */
  /* under the messages, live: what you sent (faded until the record has it), Claude at work, a menu to pick from */
  .busy { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--orange); }
  .busy i { width: 7px; height: 7px; border-radius: 4px; background: var(--orange); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  .ask { background: var(--bar); border: 1px solid var(--cardB); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
  .ask .head { align-self: flex-start; font-size: 11px; color: var(--fg2); background: var(--tint); border-radius: 9px; padding: 1px 8px; }
  .ask .q { white-space: pre-wrap; font-size: 14px; font-weight: 600; color: var(--fgHi); padding: 0 2px 4px; }
  .ask .note { font-size: 13px; color: var(--fg2); padding: 0 2px; }
  .ask .pick { display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  .ask .pick .n { flex: none; display: grid; place-items: center; width: 20px; height: 20px; margin: -1px 0; border-radius: 50%; background: var(--tint); color: var(--fg2); font: 600 11px var(--ui); }
  .ask .pick.own { border-color: transparent; background: none; color: var(--fg2); padding: 4px 12px; } /* Claude's own: write in, chat */
  .ask .pick.on { background: var(--accentBg); border-color: var(--accent); }
  .ask .row2 { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .ask .row2 button { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: var(--btn); }
  .ask .row2 .push { margin-right: auto; }
  .ask .tabsQ { font-size: 12px; color: var(--fg2); padding: 0 2px; }
  .ask .pick small { display: block; margin-top: 2px; font-size: 12px; color: var(--fg2); }
  .ask .pick .box { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-top: 1px; border: 1.5px solid var(--fg2); border-radius: 4px; }
  .ask .pick .box.on { background: var(--accent); border-color: var(--accent); }
  .ask .pick .box.on::after { content: '✓'; color: #fff; font-size: 10px; line-height: 1; }
  .ask .hint2 { font-size: 12px; color: var(--accent); padding: 2px; }
  @media (hover: hover) { .ask .pick:hover { border-color: var(--accent); } .ask .pick.own:hover { color: var(--fg); background: var(--hover); } }
  .keys { display: flex; gap: 4px; padding: 6px; overflow-x: auto; border-top: 1px solid var(--border); scrollbar-width: none; flex: none; }
  .keys button { flex: 1 0 auto; min-width: 32px; background: var(--btn); border-radius: 6px; padding: 8px 4px; font-size: 13px; font-weight: 600; }
  /* the input: one box, the pictures waiting at its top, the text, a bar inside its bottom (pictures left, 发送 right) */
  .send { width: 100%; max-width: 1640px; margin: 0 auto; padding: 6px 20px calc(14px + env(safe-area-inset-bottom)); flex: none; }
  .box { display: flex; flex-direction: column; background: var(--input); border: 1px solid var(--inputB); border-radius: 12px; box-shadow: 0 2px 10px var(--lift); }
  .box:focus-within { border-color: var(--accent); }
  .bar { display: flex; align-items: flex-end; gap: 4px; padding: 5px; }
  .bar .pic { width: 32px; height: 32px; }
  .bar .pic svg { width: 18px; height: 18px; }
  .atts { display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px; }
  .atts:empty { display: none; }
  .att { position: relative; flex: none; }
  .att img { height: 56px; width: auto; max-width: 120px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; display: block; }
  .att button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 10px; background: var(--fg2); color: var(--bg); display: grid; place-items: center; }
  .att button svg { width: 12px; height: 12px; }
  .att.file { display: flex; align-items: center; gap: 6px; height: 56px; max-width: 200px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bar); font-size: 12px; }
  .att.file > svg { width: 16px; height: 16px; flex: none; color: var(--fg2); }
  .att.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* a picture in the conversation: fixed height (nothing jumps as it loads), tap for the whole of it */
  .hm.img { align-self: flex-end; margin-top: 14px; line-height: 0; }
  .hm.img + .hm.img, .hm.img + .hm.user { margin-top: 0; } /* a message's pictures and its words together */
  .hm.img img { height: 200px; width: auto; max-width: 100%; min-width: 60px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; background: var(--bar); }
  .hm.img.pending { opacity: .5; }
  .box textarea { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; resize: none; height: 32px; max-height: 200px; border: 0; border-radius: 0; background: none; padding: 6px 4px; }
  .go { width: 32px; height: 32px; flex: none; padding: 0; border-radius: 8px; display: grid; place-items: center; }
  .go svg { width: 18px; height: 18px; }

// a tab put behind another sleeps, and wakes up where it was.
function makeGroup(ref, left) { // after ref (or before it: left), or last
  const g = { tabs: [], active: null, size: 1, el: document.createElement('div') };
  g.el.className = 'group blank';
  g.el.innerHTML = `<div class="tabs"><button class="ico list" title="对话列表">${svg(I.list)}</button><div class="strip"></div>
    <button class="ico split" title="向右拆分">${svg(I.split)}</button></div>

      <div class="btns"><button class="btn primary" data-new>＋ 新对话</button><button class="btn" data-shut>关闭这一栏</button></div></div></div>`;
  g.strip = g.el.querySelector('.strip'); g.body = g.el.querySelector('.body');
  g.el.addEventListener('pointerdown', () => focusGroup(g), true);
  g.el.querySelector('.list').onclick = () => { sideOn = !sideOn; drawSide(); save(); };
  g.el.querySelector('.split').onclick = () => split(g);
  g.el.querySelector('[data-new]').onclick = newSheet;
  g.el.querySelector('[data-shut]').onclick = () => dropGroup(g);
  g.strip.onclick = (e) => {
    const x = e.target.closest('[data-x]'), t = e.target.closest('[data-i]');
    if (x) closeConv(g.tabs[+x.dataset.x]); else if (t) activate(g, g.tabs[+t.dataset.i]);
  };
  g.strip.onmousedown = (e) => { if (e.button === 1) e.preventDefault(); }; // a middle click closes, doesn't scroll
  // a tab shows on the press (a mouse's left button), as in VS Code: a hand that moves a few pixels while pressing makes

    const x = scr.querySelector('.xterm-screen');
    if (!x?.offsetWidth) return;
    const fits = () => x.offsetWidth <= scr.offsetWidth - 26 && x.offsetHeight <= scr.offsetHeight - 10;
    const k = Math.min((scr.offsetWidth - 26) / x.offsetWidth, (scr.offsetHeight - 10) / x.offsetHeight);
    term.options.fontSize = Math.max(5, Math.min(FONT, Math.floor(term.options.fontSize * k)));
    while (!fits() && term.options.fontSize > 5) term.options.fontSize--;
    while (term.options.fontSize < FONT) { term.options.fontSize++; if (!fits()) { term.options.fontSize--; break; } }
  }
  async function start() {
    c.started = true; c.ended = false; notice();
    gen++; es?.close(); es = null; term?.dispose(); scr.innerHTML = '';
    mine = ptySize = key = kind = null; switching = 0; fails = 0;
    histEnd = histOldest = null; histNow = false; histGen++; sent = []; liveHtml = ''; hist.innerHTML = '';
    term = new Terminal({ fontSize: FONT, lineHeight: 1.12, theme: THEME, cursorBlink: true, scrollback: 5000, allowProposedApi: true,
      fontFamily: '"SF Mono", Menlo, "Cascadia Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace' });
    fit = new FitAddon.FitAddon(); term.loadAddon(fit);
    term.loadAddon(new Unicode11Addon.Unicode11Addon()); term.unicode.activeVersion = '11'; // Chinese and emoji two cells wide, as Claude Code counts them
    term.loadAddon(new WebLinksAddon.WebLinksAddon()); // links open in a new tab
    term.open(scr);
    txt = document.createElement('div'); txt.className = 'txt'; txt.style.fontSize = FONT + 'px'; scr.append(txt);
    txt.onclick = () => { if (!getSelection().toString()) term.focus(); }; // the keys to Claude; a selection is for copying
    // WebGL on a computer only: sharper and faster there; on phones it drew at the wrong pixel density, and
    // mobile browsers drop its context when the page goes to the background
    if (FINE) try { const gl = new WebglAddon.WebglAddon(); gl.onContextLoss(() => gl.dispose()); term.loadAddon(gl); } catch {}
    fit.fit();
    if (!scr.clientWidth) term.resize(100, 40); // only the chat shown: room for a menu with its question
    term.onData(input);
    term.onWriteParsed(() => { if (shown && view === 'hist' && !liveT) liveT = setTimeout(() => { liveT = 0; drawLive(); }, 200); }); // its screen changed
    // on the next frame, not after a wait: a key typed shows as soon as the window echoes it (a draw costs ~1 ms)
    term.onWriteParsed(() => { if (shown && view === 'term' && !txtT) txtT = requestAnimationFrame(() => { txtT = 0; drawTxt(); }); });
    setView(view); redraw();
    try { ({ key, kind } = await post('/api/open', { ...body, cols: term.cols, rows: term.rows })); }
    catch (e) { if (!c.closed) { c.ended = true; notice('gone', e.message); redraw(); } return; }
    if (c.closed) return;
    redraw(); connect();
    if (FINE && shown) line.focus(); // a phone would pop its keyboard over the screen
  }
  async function resume() { // 接着聊: like opening it from the list
    const s = state?.sessions.find((x) => x.id === c.id);
    if (!s) return toast('这个对话已经不在列表里了');
    const acct = s.pid ? s.acct + 1 : await pickAcct(s);
    if (!acct || c.closed) return;
    body = { id: s.id, acct }; c.acct = acct; start();
  }
  // The live stream, while the tab is shown. It is opened again when it goes quiet (a computer waking up, a phone back
  // from the background, a network change: a browser never notices a dead connection itself; the server pings every
  // 15 s) or is refused (the server restarted, or a window's reader stopped after 20 min unwatched). Again means
  // opening the conversation again for a fresh key, only while it still runs: one that ended isn't started anew.
  // Each connect has a number: one overtaken by a newer connect, the tab put behind or closed, drops out.
  const end = () => { c.ended = true; gen++; es?.close(); es = null; notice('gone', '这个对话已经结束'); drawLive(); redraw(); };
  async function connect(again) {
    const me = ++gen;
    es?.close(); es = null;
    if (!term || c.ended || !shown) return;
    if (again && c.id) {
      let r;
      try { r = await post('/api/open', { id: c.id, live: true, cols: term.cols, rows: term.rows }); }
      catch (e) { // the service saying it no longer runs ends it; no network, or the PC away (a phone just woken): again soon
        if (me !== gen) return;
        if (e instanceof TypeError || e.away) setTimeout(() => { if (me === gen) connect(true); }, 5000); else end();
        return;
      }
      if (me !== gen || !term) return;
      ({ key, kind } = r);
    }
    lastSeen = Date.now();
    const s = es = new EventSource('/api/term?key=' + encodeURIComponent(key));
    const on = (ev, fn) => s.addEventListener(ev, (e) => { if (es !== s) return; lastSeen = Date.now(); fn(e); });
    // every (re)connection, the browser's own retries too, starts with everything sent again: a conversation's
    // output so far, or a window's kept lines and screen, so the screen is cleared first
    s.onopen = () => { if (es === s) { term.reset(); fails = 0; } };
    on('ping', () => {});
    on('data', (e) => term.write(JSON.parse(e.data)));
    on('size', (e) => {
      const z = JSON.parse(e.data);
      if (!z.w) return;
      if (kind === 'pty') ptySize = z;
      if (kind === 'pty' && mine && z.w === mine.cols && z.h === mine.rows) { if (term.cols !== z.w || term.rows !== z.h) { term.options.fontSize = FONT; fit.fit(); } return; }
      // a window's size; or another screen took it, or this one hasn't (only the chat shown): that size, scaled
      term.resize(z.w, z.h); sizeFont();
    });
    on('gone', () => { if (!switching || kind === 'pty') end(); }); // a window's old Claude gone while switching: follow() goes on
    on('switched', (e) => { key = JSON.parse(e.data).key; kind = 'pty'; switched(); connect(); });
    on('swapfail', (e) => { switching = 0; toast(JSON.parse(e.data).err, 5000); redraw(); }); // it stays on this account (follow() stops)
    s.onerror = () => { // CLOSED: refused (the browser retries the rest itself)
      if (es !== s || s.readyState !== EventSource.CLOSED || c.ended) return;
      if (!c.id || ++fails > 5) return end(); // a brand-new one can't be found again by id; or it keeps failing
      setTimeout(() => { if (es === s) connect(true); }, 1500);
    };
    redraw();
    if (kind === 'pty') { mine = null; claim(); } // this screen's size
  }

  c.sync = () => { // from the list: its title and account; and where it runs
    const s = c.id ? state?.sessions.find((x) => x.id === c.id) : null;
    if (s) { c.title = s.title; c.acct = s.pid ? s.acct + 1 : body.acct ?? s.acct + 1; }
    const cwd = s?.cwd ?? body.dir ?? '', parts = cwd.split(/[\\/]/).filter(Boolean);
    const dir = isButler({ cwd }) ? ['管家'] : parts.length > 3 ? ['…', ...parts.slice(-2)] : parts;
    const where = c.ended ? '已结束' : key ? (kind === 'pc' ? '在电脑窗口里运行' : '在网页上运行') : c.started ? '连接中…' : '没有在运行';
    $p('.path').innerHTML = dir.map((p, i) => i === dir.length - 1 ? `<b>${esc(p)}</b>` : esc(p)).join(' › ') + ` <span class="dim">· 账号 ${c.acct ?? '?'} · ${where}</span>`;
    $p('.path').title = cwd;
  };
  c.wake = () => { // shown: started if it should be, its stream and record going again
    shown = true; el.classList.add('on'); readNote(c.id);
    if (!c.started) {
      const s = c.id && state?.sessions.find((x) => x.id === c.id);
      if (body.acct || s?.pid) { if (!body.acct) body = { id: c.id, acct: s.acct + 1 }; return start(); }
      notice('idle', '这个对话没有在运行'); c.sync();
    } else if (!c.ended && !es && key) connect();
    setView(view);
  };
  c.sleep = () => { shown = false; el.classList.remove('on'); clearInterval(histTimer); gen++; es?.close(); es = null; c.live = ''; readNote(c.id); };
  c.close = () => { c.closed = true; c.sleep(); ro.disconnect(); clearTimeout(liveT); clearTimeout(fitT); term?.dispose(); term = null; key = null; switching = 0; el.remove(); };
  c.claim = claim;
  c.where = () => (key && !c.ended ? kind : null); // 'pc' a window on the computer, 'pty' the web service
  c.focus = () => { if (view === 'hist') line.focus({ preventScroll: true }); else term?.focus(); };
  c.back = () => { if (shown && key) { if (stale(25000)) connect(true); else claim(); } }; // back to this screen after a while: the stream likely died meanwhile
  c.tick = () => { if (stale(45000)) connect(true); };
  return c;
}
setInterval(() => shownConvs().forEach((c) => c.tick()), 10000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') shownConvs().forEach((c) => c.back()); });
window.addEventListener('focus', () => shownConvs().forEach((c) => c.claim())); // this screen takes the size again

// Messages into a box: your message and Claude's answer. How it got there, its tool calls and its words between them,
// folds into one line under your message, "过程：6 个操作（命令 3、读文件 2…）" (tap to see it all). Claude's words
// stay out until its next tool call: then they were on the way, not the answer, and fold in too. A turn over ends
// with how long it took. Added to piece by piece as the record grows: the box's end says where the turn is.
const KIND = { Bash: '命令', PowerShell: '命令', Read: '读文件', Edit: '改文件', Write: '改文件', NotebookEdit: '改文件', Grep: '搜索', Glob: '搜索',
  WebSearch: '查网页', WebFetch: '查网页', Agent: '子任务' };
const dur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s} 秒` : s < 3600 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${Math.floor(s / 3600)} 小时 ${Math.floor(s / 60) % 60} 分`; };
function addItems(box, items) {
  for (const m of items) {
    // Claude's answer begins (its words or its first tool call right after your message): marked as Claude's
    if ((m.role === 'claude' || m.role === 'tool') && box.lastElementChild?.matches('.hm.user, .hm.img'))
      box.insertAdjacentHTML('beforeend', `<div class="who">${SPARK}Claude</div>`);
    // a message of yours on the line an earlier one hung on, nothing answering that one: it was stopped and taken back
    // (the record keeps it, Claude doesn't), so it goes (the service leaves such out of what it reads at once)
    const mark = m.u ? ` data-p="${esc(m.p)}" data-u="${esc(m.u)}"` : '';
    if (m.u && box.isConnected) {
      const col = box.closest('.col'), answers = [...col.querySelectorAll('.who, details.tools, .hm.claude, .hm.done')];
      for (const e of col.querySelectorAll(`[data-p="${CSS.escape(m.p)}"]:not([data-u="${CSS.escape(m.u)}"])`))
        if (!answers.some((x) => e.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING)) e.remove();
    }
    if (m.role === 'img') { box.insertAdjacentHTML('beforeend', `<a class="hm img" href="${esc(m.src)}" target="_blank"${mark}><img src="${esc(m.src)}" loading="lazy" alt="图片"></a>`); continue; }
    if (m.role === 'user' && !m.text) continue; // pictures only
    if (m.role === 'done') { // the turn over: how long it took, up front on the line that begins the answer
      let e = box.lastElementChild;
      while (e && !e.matches('.who, .hm.user, .hm.img')) e = e.previousElementSibling;
      const took = `✓ 回复完成 · 用时 ${dur(+m.text)}`;
      // ponytail: Claude going on by itself (a background task's news) and ending again: the line shows the last time
      if (e?.matches('.who')) { e.querySelector('.took')?.remove(); e.insertAdjacentHTML('beforeend', `<span class="took">${took}</span>`); }
      else box.insertAdjacentHTML('beforeend', `<div class="hm done">${took}</div>`); // its start not loaded (or no answer): at the end
      continue;
    }
    if (m.role !== 'tool') {
      box.insertAdjacentHTML('beforeend', m.role === 'done' ? `<div class="hm done">✓ 回复完成 · 用时 ${dur(+m.text)}</div>`
        : `<div class="hm ${m.role}"${mark}>${m.role === 'note' ? esc(m.text) : md(m.text)}</div>`);
      continue;
    }
    const words = []; // Claude's words since the turn's 过程 (or its start): on the way after all
    let e = box.lastElementChild;
    while (e?.matches('.hm.claude')) { words.unshift(e); e = e.previousElementSibling; }
    let g = e?.matches('details.tools') ? e : null;
    if (!g) { g = document.createElement('details'); g.className = 'tools'; g.innerHTML = '<summary></summary><div></div>'; if (words[0]) words[0].before(g); else box.append(g); }
    const list = g.lastElementChild, n = {};
    for (const w of words) { w.classList.add('sub'); list.append(w); }
    list.insertAdjacentHTML('beforeend', `<div class="hm tool" data-k="${KIND[m.text.split(/\s/)[0]] ?? '其他'}">${esc(m.text)}</div>`);
    const tools = list.querySelectorAll('.hm.tool');
    for (const t of tools) n[t.dataset.k] = (n[t.dataset.k] ?? 0) + 1;
    g.firstElementChild.textContent = `过程：${tools.length} 个操作（${Object.entries(n).map(([k, v]) => `${k} ${v}`).join('、')}）`;
  }
}
// A picture made ready to send: a big one (a phone's photo) to 2000 px on its long side as JPEG, on white (Claude
// scales larger ones down anyway, and it goes up faster over a phone's network); a small PNG/JPEG/GIF/WebP as it is.
async function shrink(f) {
  if (/^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size < 1.5e6) return f;
  let b;
  try { b = await createImageBitmap(f); } catch { throw new Error('这张图片打不开'); }
  const k = Math.min(1, 2000 / Math.max(b.width, b.height)), cv = document.createElement('canvas');
  cv.width = Math.round(b.width * k); cv.height = Math.round(b.height * k);
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(b, 0, 0, cv.width, cv.height);
  return new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.9));
}
async function sendFile(f) { // a file as it is, its name kept (Claude reads it by its path): where it was saved
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-name': encodeURIComponent(f.name) }, body: f });
  const j = await r.json().catch(() => ({ err: r.status === 413 ? '文件太大了（最大 20 MB）' : `出错了（${r.status}）` }));
  if (!r.ok) throw new Error(j.err || r.status);
  return j.path;
}
async function upload(blob) { // to the computer: where it was saved there
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': blob.type }, body: blob });
  const j = await r.json().catch(() => ({ err: r.status === 413 ? '图片太大了' : `出错了（${r.status}）` }));
  if (!r.ok) throw new Error(j.err || r.status);
  return j.path;
}

// enough Markdown for Claude's replies: code blocks, tables, inline code, bold, headings. A table drawn as one, its
// cells wrapping to the width as Claude Code's terminal draws it: rows of | cells |, the |---| line under the header
// (a \| in a cell is a |). Lines of | without that line aren't a table: kept as they are, monospace.
const table = (rows) => {
  const cells = rows.trim().split('\n').map((r) => r.trim().replace(/^\||\|$/g, '').replace(/\\\|/g, '\0').split('|').map((c) => c.trim().replace(/\0/g, '|')));
  if (!cells[1]?.every((c) => /^:?-+:?$/.test(c))) return `<div class="mono">${rows}</div>`;
  const [head] = cells.splice(0, 2);
  return `<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead>`
    + `<tbody>${cells.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
function md(t) {
  return esc(t).split(/```[^\n]*\n?/).map((p, i) => i % 2 ? `<pre>${p.replace(/\n$/, '')}</pre>`
    : p.replace(/((?:^\|.*\n?)+)/gm, table).replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4} +(.*)$/gm, '<b class="h">$1</b>')).join('');
}

focusGroup(makeGroup());
drawSide();
load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 5000);
</script>
