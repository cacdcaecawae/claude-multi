<style>
  :root { --bg: #000; --card: #161618; --card2: #1f1f22; --line: rgba(255,255,255,.08); --fg: #fff; --fg2: rgba(255,255,255,.62);
    --fg3: rgba(255,255,255,.38); --green: #30d158; --orange: #ff9f0a; --red: #ff453a; --blue: #0a84ff; --a1: #0a84ff; --a2: #ff9f0a; --a3: #bf5af2; --a4: #30d158; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 0; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  main { padding: 6px 16px 96px; max-width: 720px; margin: 0 auto; }
  #brand { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; padding: 12px 16px 0; font-size: 13px; font-weight: 600; color: var(--fg2); }
  #brand img { width: 22px; height: 22px; border-radius: 6px; }
  h1 { font-size: 26px; margin: 6px 0 2px; }
  .sub { color: var(--fg3); font-size: 13px; margin-bottom: 16px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--fg2); margin: 22px 4px 8px; display: flex; justify-content: space-between; align-items: center; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border-radius: 14px; margin-bottom: 8px; width: 100%; text-align: left; }
  .row:active { background: var(--card2); }
  .row .main { flex: 1; min-width: 0; }
  .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .m { font-size: 12.5px; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 8px; white-space: nowrap; }
  .chip.pc { background: rgba(48,209,88,.16); color: var(--green); }
  .chip.web { background: rgba(10,132,255,.18); color: #64b5ff; }
  .dot { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; flex: none; font-size: 14px; }
  .dot.done { background: rgba(48,209,88,.18); color: var(--green); }
  .dot.ask { background: rgba(255,159,10,.18); color: var(--orange); }
  .btn { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 600; }
  .btn.primary { background: #fff; color: #000; }
  .btn:disabled { opacity: .4; }
  .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; flex: 1; }
  .bar > i { display: block; height: 100%; border-radius: 3px; }
  .win { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg2); margin-top: 8px; }
  .win b { width: 40px; text-align: right; color: var(--fg); }
  .win span:first-child { width: 42px; }
  .win span:last-child { width: 84px; text-align: right; color: var(--fg3); }
  .renew { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--fg3); white-space: nowrap; }
  .renew svg { width: 11px; height: 11px; margin-top: -2px; }
  .renew.end { color: var(--orange); } /* renewal turned off: the day it ends */
  .rec { color: var(--green); font-size: 12px; font-weight: 600; background: rgba(48,209,88,.14); padding: 2px 8px; border-radius: 8px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--card); border-radius: 16px; padding: 12px 14px; }
  .tile .k { font-size: 12px; color: var(--fg2); } .tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; } .tile .u { font-size: 13px; color: var(--fg2); font-weight: 600; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 130px; padding-top: 6px; }
  .bars > div { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; }
  .bars i { display: block; border-radius: 3px 3px 0 0; }
  .ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--fg3); margin-top: 6px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg2); margin-top: 8px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 4px; margin-right: 5px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: rgba(18,18,20,.92); backdrop-filter: blur(20px);
    border-top: 1px solid var(--line); padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); z-index: 5; }
  nav button { flex: 1; padding: 6px 0; font-size: 12px; color: var(--fg3); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav button.on { color: var(--fg); }
  nav svg { width: 22px; height: 22px; }
  .badge { background: var(--orange); color: #000; font-size: 11px; font-weight: 700; border-radius: 8px; padding: 0 6px; margin-left: 6px; }
  .empty { color: var(--fg3); text-align: center; padding: 24px 0; font-size: 14px; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 20; }
  .sheet.on { display: flex; }
  .sheet .in { background: #1c1c1e; border-radius: 20px 20px 0 0; width: 100%; max-width: 720px; margin: 0 auto; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .opt { padding: 8px 12px; border-radius: 12px; background: rgba(255,255,255,.08); font-size: 14px; border: 1px solid transparent; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt.on { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.6); }
  input[type=text], textarea { width: 100%; background: rgba(255,255,255,.08); border: 0; border-radius: 12px; color: var(--fg); font: inherit; padding: 10px 12px; outline: none; }
  /* 16px at least: under that, an iPhone zooms the page in on typing and doesn't zoom back out (the terminal's
     hidden input box is a textarea too) */
  input, textarea { font-size: 16px !important; }
  html:has(#term.on) { overflow: hidden; } /* the list behind the terminal doesn't scroll */
  #term { position: fixed; inset: 0; background: #0b0b0d; z-index: 10; display: none; flex-direction: column; padding-top: env(safe-area-inset-top); }
  #term.on { display: flex; }
  #termHead { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  #termHead .main { flex: 1; min-width: 0; }
  /* 终端 | 记录: the record reads the conversation's saved messages, scrollable, at the screen's width */
  .seg { display: flex; background: rgba(255,255,255,.08); border-radius: 10px; padding: 2px; flex: none; }
  .seg button { padding: 4px 12px; border-radius: 8px; font-size: 13px; color: var(--fg2); }
  .seg button.on { background: rgba(255,255,255,.16); color: var(--fg); font-weight: 600; }
  #hist { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 14px 18px; display: none; }
  #term.hist #hist { display: block; }
  #term.hist #screen, #term.hist #keys { display: none; }
  #term.hist #send { display: flex; }
  #hist .col { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  #hOld, #hNew { display: contents; } /* their messages sit in the column's flow */
  .hm { white-space: pre-wrap; word-break: break-word; font-size: 14.5px; line-height: 1.6; }
  .hm.user { align-self: flex-end; max-width: 85%; background: rgba(10,132,255,.2); border-radius: 16px 16px 4px 16px; padding: 8px 13px; }
  .hm.tool { font: 12.5px/1.4 "SF Mono", Menlo, Consolas, monospace; color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm.tool::before { content: '● '; color: var(--green); }
  .hm.note { align-self: center; font-size: 12px; color: var(--fg3); }
  .hm pre, .hm .mono { font: 12.5px/1.45 "SF Mono", Menlo, Consolas, monospace; background: rgba(255,255,255,.06); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 4px 0; }
  .hm code { font: .9em "SF Mono", Menlo, Consolas, monospace; background: rgba(255,255,255,.08); border-radius: 4px; padding: 1px 4px; }
  .hm .h { font-size: 15.5px; }
  /* a turn: your message a little apart from the one before; Claude's tool calls in a row folded into one line
     (tap to see each); the end of the answer marked */
  .hm.user { margin-top: 14px; }
  details.tools summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--fg3); }
  details.tools summary::-webkit-details-marker { display: none; }
  details.tools summary::before { content: '▸ '; } details.tools[open] summary::before { content: '▾ '; }
  details.tools > div { display: flex; flex-direction: column; gap: 4px; margin: 6px 0 2px 16px; }
  .hm.done { font-size: 12.5px; color: var(--green); }
  /* under the messages, live: what you sent (faded until the record has it), Claude at work, a menu to pick from */
  #live { display: contents; }
  .hm.user.pending { opacity: .5; }
  .busy { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--orange); }
  .busy i { width: 8px; height: 8px; border-radius: 4px; background: var(--orange); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #go.stop { background: var(--red); color: #fff; }
  .ask .row2 button { font-size: 12.5px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,.1); }
  .ask { background: var(--card); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .ask .q { white-space: pre-wrap; font-size: 13.5px; color: var(--fg2); padding: 2px 4px 4px; }
  .ask .pick { text-align: left; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 14px; }
  .ask .pick.on { background: rgba(10,132,255,.3); }
  .ask .row2 { display: flex; gap: 8px; justify-content: flex-end; }
  #screen { flex: 1; min-height: 0; overflow: auto; background: #0b0b0d; }
  #screen .xterm { padding: 6px 2px 4px 10px; background: #0b0b0d; } /* on the terminal itself: the fit add-on subtracts it */
  #keys { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; border-top: 1px solid var(--line); scrollbar-width: none; }
  #keys button { flex: none; background: rgba(255,255,255,.1); border-radius: 9px; padding: 7px 11px; font-size: 13px; font-weight: 600; }
  #send { display: flex; gap: 8px; padding: 6px 8px calc(8px + env(safe-area-inset-bottom)); }
  #send textarea { flex: 1; resize: none; height: 44px; max-height: 120px; }
  .btn.icon { padding: 6px 8px; display: grid; place-items: center; flex: none; }
  .btn.icon svg { width: 18px; height: 18px; }
  .opt small { color: var(--fg3); font-size: 12px; margin-left: 4px; }
  .opt:disabled { opacity: .45; }
  #gone { display: none; background: rgba(255,69,58,.15); color: #ff8a80; font-size: 13px; padding: 6px 12px; }
  /* a computer's browser: the real keyboard types straight into the terminal, so no key row or input box */
  @media (pointer: fine) { #keys, #send { display: none; } }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #2c2c2e; padding: 10px 16px; border-radius: 12px; font-size: 14px;
    z-index: 30; max-width: 90vw; white-space: pre-wrap; display: none; }
</style>
</head>
<body>
<header id="brand"><img src="/icon-180.png?spark" alt=""><span>Claude 多账号</span></header>
<main id="view"></main>
<nav>
  <button data-tab="chats" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H8l-4 4z"/></svg>对话</button>
  <button data-tab="usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>额度</button>
  <button data-tab="tokens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19V11M10 19V6M15 19v-9M20 19v-5"/></svg>用量</button>
</nav>

<div id="term">
  <div id="termHead">
    <button id="back" class="btn" aria-label="返回">‹</button>
    <div class="main"><div class="t" id="termTitle"></div><div class="m" id="termSub"></div></div>
    <button id="swap" class="btn icon" aria-label="换账号继续" title="换账号继续"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5"/></svg></button>
    <button id="end" class="btn icon" aria-label="结束对话" title="结束对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 4v7M7.4 6.6a7 7 0 1 0 9.2 0"/></svg></button>
    <div class="seg" id="seg"><button data-v="hist" class="on">对话</button><button data-v="term">终端</button></div>
  </div>
  <div id="gone">这个对话已经结束</div>
  <div id="screen"></div>
  <div id="hist"></div>
  <div id="keys"></div>
  <div id="send"><textarea id="line" placeholder="输入，按发送" enterkeyhint="send"></textarea><button class="btn primary" id="go">发送</button></div>
</div>

<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ACCT = ['var(--a1)', 'var(--a2)', 'var(--a3)', 'var(--a4)'];
const post = async (url, body) => {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body ?? {}) });
  const j = await r.json(); if (!r.ok) throw new Error(j.err || r.status); return j;
};
const toast = (t, ms = 2600) => { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => (e.style.display = 'none'), ms); };
const ago = (ms) => { const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? '刚刚' : m < 60 ? `${m} 分钟前` : m < 1440 ? `${Math.round(m / 60)} 小时前` : `${Math.round(m / 1440)} 天前`; };
const fmtTok = (n) => n >= 1e8 ? `${(n / 1e8).toFixed(2)} 亿` : n >= 1e4 ? `${Math.round(n / 1e4).toLocaleString()} 万` : Math.round(n).toLocaleString();
const usd = (u) => '$' + (u >= 1000 ? Math.round(u).toLocaleString() : u.toFixed(2));

let tab = ['chats', 'usage', 'tokens'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'chats', state = null, tokens = null;
// Like the island: continue on the conversation's own account while it still gives an hour of work, else the pick.
// One account to the end, as in the island: a conversation continues on its own account. Only when that one
// has under an hour left and the recommended one has more, a sheet asks first (accounts don't share their
// prompt cache). Resolves to the account number, or 0 when cancelled.
function pickAcct(s) {
  const u = state?.usage, a = u?.accounts?.[s.acct], b = u?.accounts?.[u?.rec];
  if (!u || u.rec == null || u.rec === s.acct || !a || a.err || a.runway >= 1 || !b || b.runway <= a.runway) return Promise.resolve(s.acct + 1);
  const own = s.acct + 1, other = u.rec + 1;
  return new Promise((done) => {
    $('#sheetIn').innerHTML = `<div style="font-weight:600;font-size:17px">换个账号继续？</div>
      <div class="m" style="margin-top:4px">${esc(s.title)}</div>
      <div style="margin-top:14px;color:var(--fg)">${a.runway <= 0 ? `账号 ${own} 已经到上限了` : `账号 ${own} 只能再连续用约 ${a.runway} 小时`}，账号 ${other} 还能连续用约 ${b.runway} 小时。</div>
      <div class="m" style="margin-top:8px;white-space:normal">两个账号不共用缓存：换过去后，第一轮回复要把整段对话重新读一遍，会多用一些新账号的额度。</div>
      <div style="display:flex;gap:10px;margin-top:18px"><button class="btn" id="keepA" style="flex:1">仍用账号 ${own}</button><button class="btn primary" id="swapA" style="flex:1">换到账号 ${other}</button></div>`;
    const end = (n) => { $('#sheet').classList.remove('on'); done(n); };
    $('#keepA').onclick = () => end(own); $('#swapA').onclick = () => end(other);
    $('#sheet').classList.add('on');
  });
}

async function load(fresh) {
  try { state = await (await fetch('/api/state' + (fresh ? '?fresh=1' : ''))).json(); if (state.err) throw new Error(state.err); }
  catch (e) { $('#view').innerHTML = `<h1>连不上</h1><div class="sub">${esc(e.message)}</div>`; return; }
  render();
}
function render() {
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  ({ chats: renderChats, usage: renderUsage, tokens: renderTokens })[tab]();
}

function renderChats() {
  const notes = state.notes ?? []; // unread only: the server drops what you've read anywhere or answered since
  const run = state.sessions.filter((s) => s.pid), rest = state.sessions.filter((s) => !s.pid).slice(0, 40);
  const row = (s) => `<button class="row" data-open="${esc(s.id)}"><div class="main"><div class="t">${esc(s.title)}</div>
    <div class="m">${esc(s.cwd.split(/[\\/]/).pop())} · 账号 ${s.acct + 1}${s.prompt ? ' · ' + esc(s.prompt) : ''}</div></div>
    ${s.pid ? `<span class="chip ${s.where}">${s.where === 'web' ? '网页上' : '电脑上'}</span>` : `<span class="m">${ago(s.at)}</span>`}</button>`;
  $('#view').innerHTML = `<h1>对话</h1><div class="sub">${esc(state.me)} · 电脑上的 Claude</div>
    <button class="btn primary" id="newBtn" style="width:100%;padding:12px">＋ 新对话</button>
    ${notes.length ? `<h2><span>提示<span class="badge">${notes.length}</span></span><button class="m" id="readAll">全部已读</button></h2>
      ${notes.map((n) => `<button class="row" ${n.id ? `data-open="${esc(n.id)}"` : ''}>
        <div class="dot ${n.kind === 'ask' ? 'ask' : 'done'}">${n.kind === 'ask' ? '!' : '✓'}</div>
        <div class="main"><div class="t">${esc(n.title || n.project || 'Claude')}</div><div class="m">${esc(n.project)} · ${esc(n.msg)}</div></div>
        <span class="m">${ago(n.at)}</span></button>`).join('')}` : ''}
    ${run.length ? `<h2>运行中</h2>${run.map(row).join('')}` : ''}
    <h2>最近</h2>${rest.length ? rest.map(row).join('') : '<div class="empty">还没有对话</div>'}`;
  $('#newBtn').onclick = newSheet;
  const ra = $('#readAll'); if (ra) ra.onclick = () => post('/api/read', { all: true }).then(() => load(), (e) => toast(e.message));
  document.querySelectorAll('[data-open]').forEach((b) => (b.onclick = async () => {
    const s = state.sessions.find((x) => x.id === b.dataset.open);
    if (!s) return toast('这个对话已经不在列表里了');
    if (notes.some((n) => n.id === s.id)) post('/api/read', { id: s.id }).catch(() => {}); // opened it: its notification is done
    const acct = s.pid ? s.acct + 1 : await pickAcct(s); // a running one stays where it runs
    if (!acct) return;
    openTerm({ id: s.id, acct }, s.title, `${s.cwd} · ${s.pid ? (s.where === 'web' ? '在网页上运行' : '在电脑窗口里运行') : '用账号 ' + acct + ' 继续'}`);
  }));
}

// the next renewal (guessed monthly), with how it's paid: the App Store, Google Play, or a card on claude.ai (Stripe).
// The island draws the same three marks.
const CARD = ['银行卡订阅', 'M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM4 6v2h16V6zm0 5v7h16v-7z'];
const PAY = {
  apple_subscription: ['苹果订阅', 'M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701'],
  google_play_subscription: ['Google Play 订阅', 'M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087L1.337.924zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179l11.04 10.973zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54-3.23-3.21z'],
  stripe_subscription: CARD, stripe_subscription_contracted: CARD,
};
const renew = (s) => {

  return `<span class="renew${s.canceled ? ' end' : ''}" title="${how ? how + '，' : ''}${s.canceled ? '已取消续订，' : ''}按月推算">`
    + `${d ? `<svg viewBox="0 0 24 24"><path fill="currentColor" fill-rule="evenodd" d="${d}"/></svg>` : ''}${+s.renew.slice(5, 7)}月${+s.renew.slice(8)}日${s.canceled ? '到期' : '续费'}</span>`;
};
function renderUsage() {
  const u = state.usage;
  $('#view').innerHTML = `<h1>额度</h1><div class="sub">${u.open ? '推荐账号 ' + (u.rec + 1) : '都到上限了，最早 ' + esc(u.ready) + ' 后恢复'}</div>
    ${u.accounts.map((a, i) => `<div class="card"><div style="display:flex;align-items:center;gap:8px">
      <span style="width:9px;height:9px;border-radius:5px;background:${ACCT[i % 4]}"></span><b>账号 ${i + 1}</b>
      <span class="m" style="flex:1;min-width:0">${esc(a.label)}</span>${renew(a.sub)}${u.rec === i && u.open ? '<span class="rec">推荐</span>' : ''}</div>
      ${a.err ? `<div class="m" style="color:var(--orange);margin-top:8px">${esc(a.err)}</div>` : `
      <div class="m" style="margin-top:6px">可连续用 ${a.runway} 小时</div>
      ${a.windows.map((w) => `<div class="win"><span>${w.k === 'five_hour' ? '5 小时' : w.k === 'seven_day' ? '7 天' : esc(w.k)}</span>
        <div class="bar"><i style="width:${Math.min(100, w.pct)}%;background:${w.pct >= 80 ? 'var(--red)' : w.pct >= 50 ? 'var(--orange)' : 'var(--green)'}"></i></div>
        <b>${w.pct}%</b><span>${esc(w.reset)}后</span></div>`).join('')}`}</div>`).join('')}
    <div style="display:flex;gap:10px;margin-top:6px"><button class="btn" id="refresh" style="flex:1">刷新</button><button class="btn" id="warm" style="flex:1">预热</button></div>
    <div class="m" style="margin-top:10px;white-space:normal">预热：给还没开始计时的账号发一条很小的消息，让 5 小时窗口开始计时。</div>`;
  $('#refresh').onclick = () => load(true);
  $('#warm').onclick = async (e) => { e.target.disabled = true; e.target.textContent = '预热中…'; try { toast((await post('/api/warmup')).out, 6000); } catch (x) { toast(x.message); } load(true); };
}

async function renderTokens() {
  if (!tokens) { $('#view').innerHTML = '<h1>用量</h1><div class="sub">统计中…</div>'; try { tokens = await (await fetch('/api/tokens')).json(); } catch (e) { return toast(e.message); } }
  const t = tokens, n = t.accounts.length, map = Object.fromEntries(t.days.map((d) => [d.d, d]));
  const all = (d) => d ? d.i + d.o + d.cw + d.cr : 0;
  const key = (dt) => `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
  const days = [...Array(14)].map((_, k) => { const dt = new Date(); dt.setDate(dt.getDate() - 13 + k); return { dt, d: map[key(dt)] }; });
  const week = days.slice(-7), sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
  const max = Math.max(1, ...days.map((x) => all(x.d))), today = days.at(-1).d, active = t.days.filter((d) => all(d)).length || 1;
  $('#view').innerHTML = `<h1>用量</h1><div class="sub">${n} 个账号的对话记录 · 金额按 API 价格折算，订阅不按这个收费</div>
    <div class="tiles">
      <div class="tile"><div class="k">累计</div><div class="v">${fmtTok(t.total)}</div><div class="u">约 ${usd(t.usd)}</div></div>
      <div class="tile"><div class="k">今天</div><div class="v">${fmtTok(all(today))}</div><div class="u">约 ${usd(today?.usd ?? 0)}</div></div>
      <div class="tile"><div class="k">近 7 天</div><div class="v">${fmtTok(sum(week, (x) => all(x.d)))}</div><div class="u">约 ${usd(sum(week, (x) => x.d?.usd ?? 0))}</div></div>
      <div class="tile"><div class="k">日均</div><div class="v">${fmtTok(t.total / active)}</div><div class="u">约 ${usd(t.usd / active)}</div></div>
    </div>
    <h2>近 14 天</h2><div class="card"><div class="bars">${days.map((x) => `<div title="${x.dt.getMonth() + 1}/${x.dt.getDate()} ${fmtTok(all(x.d))} · ${usd(x.d?.usd ?? 0)}">
      ${(x.d?.by ?? []).map((b, i) => all(b) ? `<i style="height:${all(b) / max * 100}%;background:${ACCT[i % 4]}"></i>` : '').join('')}</div>`).join('')}</div>
      <div class="ticks"><span>${days[0].dt.getMonth() + 1}/${days[0].dt.getDate()}</span><span>今天</span></div>
      <div class="legend">${t.accounts.map((a, i) => `<span><i style="background:${ACCT[i % 4]}"></i>账号 ${i + 1}</span>`).join('')}</div></div>
    <h2>按账号</h2>${t.accounts.map((a, i) => `<div class="card" style="display:flex;align-items:center;gap:10px">
      <span style="width:9px;height:9px;border-radius:5px;background:${ACCT[i % 4]}"></span><div class="main" style="flex:1;min-width:0"><b>账号 ${i + 1}</b>
      <div class="m">${esc(a.label)}</div></div><div style="text-align:right"><b>${fmtTok(a.total)}</b><div class="m">约 ${usd(a.usd)}</div></div></div>`).join('')}`;
}

function newSheet() {
  const u = state.usage, dirs = u.projects ?? [];
  let acct = (u.rec ?? 0) + 1, dir = dirs[0] ?? '';
  const draw = () => {
    $('#sheetIn').innerHTML = `<b style="font-size:17px">新对话</b>
      <div class="m" style="margin-top:12px">账号</div><div class="opts">${u.accounts.map((a, i) => `<button class="opt ${acct === i + 1 ? 'on' : ''}" data-a="${i + 1}">
        账号 ${i + 1}${u.rec === i ? ' · 推荐' : ''}${a.runway != null ? ` · 可用 ${a.runway}h` : ''}</button>`).join('')}</div>
      <div class="m">文件夹</div><div class="opts">${dirs.map((d) => `<button class="opt ${dir === d ? 'on' : ''}" data-d="${esc(d)}">${esc(d.split(/[\\/]/).pop())}</button>`).join('')}</div>
      <input type="text" id="dirIn" value="${esc(dir)}" placeholder="或输入完整路径">
      <div style="display:flex;gap:10px;margin-top:14px"><button class="btn" id="cancel" style="flex:1">取消</button><button class="btn primary" id="start" style="flex:2">开始</button></div>`;
    document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => { acct = +b.dataset.a; draw(); }));
    document.querySelectorAll('[data-d]').forEach((b) => (b.onclick = () => { dir = b.dataset.d; draw(); }));
    $('#dirIn').oninput = (e) => (dir = e.target.value.trim());
    $('#cancel').onclick = () => $('#sheet').classList.remove('on');
    $('#start').onclick = () => { $('#sheet').classList.remove('on'); openTerm({ dir, acct }, dir.split(/[\\/]/).pop() || '新对话', `${dir} · 账号 ${acct}`); };
  };
  draw(); $('#sheet').classList.add('on');
}
$('#sheet').onclick = (e) => { if (e.target.id === 'sheet') e.target.classList.remove('on'); };

// --- the terminal. A conversation running in the web service (started or continued here) takes the size of
// the screen you type on, or last opened it; another screen showing it at the same time (a terminal tab on the
// computer, a second browser) scales its font to fit. One open in a window on the computer keeps that
// window's size, and the font shrinks to fit it.
let term = null, fit = null, es = null, key = null, kind = null, mine = null, ptySize = null, q = Promise.resolve();
const FINE = matchMedia('(pointer: fine)').matches, FONT = FINE ? 14 : 13; // FINE: a computer's mouse and keyboard
const THEME = { background: '#0b0b0d', foreground: '#e8e8ea', cursor: '#ffffff', cursorAccent: '#0b0b0d', selectionBackground: 'rgba(100,181,255,.35)',
  black: '#1c1c1f', red: '#ff6961', green: '#30d158', yellow: '#ffd60a', blue: '#4ea1ff', magenta: '#d48cff', cyan: '#5ad8e6', white: '#d1d1d6',
  brightBlack: '#6e6e73', brightRed: '#ff8a80', brightGreen: '#5ee07f', brightYellow: '#ffe35a', brightBlue: '#82bcff', brightMagenta: '#e2a8ff', brightCyan: '#8fe7f0', brightWhite: '#ffffff' };
const KEYS = [['Esc', '\x1b'], ['Tab', '\t'], ['⇧Tab', '\x1b[Z'], ['↑', '\x1b[A'], ['↓', '\x1b[B'], ['←', '\x1b[D'], ['→', '\x1b[C'], ['^C', '\x03'], ['⏎', '\r'], ['⌫', '\x7f']];
$('#keys').innerHTML = KEYS.map(([l], i) => `<button data-k="${i}">${l}</button>`).join('');
$('#keys').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) input(KEYS[+b.dataset.k][1]); };
// in order; when another screen had the size, this one takes it first (you type here, so it decides)
const input = (data) => {
  if (!key) return;
  const k = key, takeBack = kind === 'pty' && ptySize && mine && (ptySize.w !== mine.cols || ptySize.h !== mine.rows);
  q = q.then(() => (takeBack ? claim() : null)).then(() => post('/api/input', { key: k, data })).catch((e) => toast(e.message));
};
function claim() { // this screen's size for the conversation, while its terminal is shown here
  if (!term || kind !== 'pty' || view !== 'term') return Promise.resolve();
  term.options.fontSize = FONT; fit.fit();
  mine = { cols: term.cols, rows: term.rows }; ptySize = { w: mine.cols, h: mine.rows };
  return post('/api/resize', { key, ...mine }).catch(() => {});
}
// while Claude works and nothing's typed, 发送 is 停止 (Esc to Claude); typing makes it 发送 again: a message
// sent then waits for Claude to take it in
let busyNow = false;
function goMode() {
  const stop = view === 'hist' && busyNow && !$('#line').value.trim();
  $('#go').textContent = stop ? '停止' : '发送'; $('#go').classList.toggle('stop', stop);
}
$('#line').addEventListener('input', goMode);
$('#go').onclick = () => {
  if ($('#go').classList.contains('stop')) return input('\x1b');
  const v = $('#line').value.trim(); if (!v) return;
  // one message: the text as a paste (its new lines stay in it), then Enter on its own. Typed in one piece with its
  // Enter, a long text was taken for a paste, the Enter with it for a new line, and the message sat there unsent.
  input(`\x1b[200~${v.replace(/\n/g, '\r')}\x1b[201~`); input('\r'); $('#line').value = '';
  if (view === 'hist') { sent.push({ text: v, at: Date.now() }); drawLive(true); }
  goMode();
};
$('#line').onkeydown = (e) => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if ($('#line').value.trim()) $('#go').click(); } // only sends; Shift+Enter: a new line
  if (e.key === 'Escape' && busyNow) input('\x1b'); // as in Claude: Esc stops it
};

// --- 对话: every conversation shown as messages, from its record. Claude writes each message there once it's
// done, as its terminal shows it, so it's read every second while shown: only what was added since. A record
// can be ~100 MB: the newest piece first and, as you scroll to the top, each piece before it, put above
// without moving what you're reading. The terminal runs underneath, hidden: what the record doesn't have comes
// off its screen (Claude at work, a menu waiting for your pick), and 「终端」 shows it as it is.
let view = 'hist', histId = null, histTimer = null, histEnd = null, histOldest = null, histBusy = false, histNow = false, histGen = 0;
let sent = [], liveHtml = '', liveT = 0; // sent: your messages not in the record yet (sent while Claude works, they wait)
function setView(v) {
  view = v;
  $('#term').classList.toggle('hist', v === 'hist');
  document.querySelectorAll('#seg button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  clearInterval(histTimer); goMode();
  if (v === 'hist') { loadHist(); histTimer = setInterval(() => { if (document.visibilityState === 'visible') loadHist(); }, 1000); }
  else if (term) { if (kind === 'pc') sizeFont(); else claim(); if (FINE) term.focus(); } // shown: measure again
}
$('#seg').onclick = (e) => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };
// Messages into a box. Tool calls in a row fold into one line saying what they were, "6 个操作：命令 3、读文件 2…"
// (tap to see each); a turn over ends with how long it took.
const KIND = { Bash: '命令', PowerShell: '命令', Read: '读文件', Edit: '改文件', Write: '改文件', NotebookEdit: '改文件', Grep: '搜索', Glob: '搜索',
  WebSearch: '查网页', WebFetch: '查网页', Agent: '子任务' };
const dur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s} 秒` : s < 3600 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${Math.floor(s / 3600)} 小时 ${Math.floor(s / 60) % 60} 分`; };
function addItems(box, items) {
  for (const m of items) {
    if (m.role !== 'tool') {
      box.insertAdjacentHTML('beforeend', m.role === 'done' ? `<div class="hm done">✓ 回复完成 · 用时 ${dur(+m.text)}</div>`

    }

    for (const t of list.children) n[t.dataset.k] = (n[t.dataset.k] ?? 0) + 1;

}
async function histGet(q) { // by the terminal's key once it's open (a new conversation has no id), else the id
  const r = await (await fetch(`/api/history?key=${encodeURIComponent(key ?? '')}&id=${encodeURIComponent(histId ?? '')}${q}`)).json();
  if (r.err) throw new Error(r.err);
  // a long paste is recorded as Claude Code hands it to the model, in <pasted_content id="N"> … </pasted_content id="N">:
  // shown without them, and so your message sent here is found in the record (not shown twice)
  for (const m of r.items ?? []) if (m.role === 'user') m.text = m.text.replace(/<pasted_content id="[^"]*">\n?([\s\S]*?)\n?<\/pasted_content id="[^"]*">/g, '$1').trim();
  return r;
}
async function loadHist() {
  if (histNow || (!key && !histId)) return;

  try {
    const r = await histGet(first ? '' : `&from=${histEnd}`);
    if (g !== histGen) return; // closed, or another one opened meanwhile
    histId ??= r.id; // a new one: which conversation it became, for marking its notifications read
    if (first) { histOldest = r.start; el.innerHTML = '<div class="col"><div id="hTop" class="hm note"></div><div id="hOld"></div><div id="hNew"></div><div id="live"></div></div>'; }
    histEnd = r.end;
    if (r.items.length) {
      const atEnd = first || el.scrollHeight - el.scrollTop - el.clientHeight < 80;
      addItems($('#hNew'), r.items);
      const flat = (s) => s.replace(/\s+/g, ' '); // a paste's new lines may come back as \r\n
      for (const m of r.items) { const i = m.role === 'user' ? sent.findIndex((s) => flat(s.text) === flat(m.text)) : -1; if (i >= 0) sent.splice(i, 1); }
      if (atEnd) el.scrollTop = el.scrollHeight;
    }
    drawLive(first);
    topNote();
    if (first && el.scrollTop < 300) loadOlder(); // too little to scroll yet: fill from before
  } catch (e) { if (g === histGen && first) el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

}
function topNote() {
  const t = $('#hTop');
  if (t) t.textContent = histOldest > 0 ? '往上划，加载更早的记录' : $('#hOld').innerHTML || $('#hNew').innerHTML ? '对话开头' : '还没有消息，在下面发一条开始';
}
async function loadOlder() {
  if (histBusy || !histOldest || view !== 'hist') return;
  histBusy = true;
  const g = histGen, el = $('#hist');
  try {
    const r = await histGet(`&end=${histOldest}`);
    if (g !== histGen || !$('#hOld')) return;
    const h = el.scrollHeight;
    const tmp = document.createElement('div'); addItems(tmp, r.items); $('#hOld').prepend(...tmp.childNodes);
    histOldest = r.start; topNote();
    el.scrollTop += el.scrollHeight - h; // what you were reading stays where it was
  } catch {} finally { histBusy = false; }

$('#hist').addEventListener('scroll', (e) => { if (e.target.scrollTop < 300) loadOlder(); });
// Off the terminal's screen. Claude at work shows a spinner row, "✻ Gallivanting… (37s · ↓ 2.9k tokens)"; a
// menu (its question, a permission) numbered options with ❯ at the current one: the options counted from it
// up and down, nearest first, so a numbered list in the text above isn't taken for them.
function screen() {
  const b = term.buffer.active, rows = [];
  for (let i = 0; i < term.rows; i++) rows.push((b.getLine(b.baseY + i)?.translateToString(true) ?? '').replace(/^\s*│|│\s*$/g, '')); // a boxed menu too
  const busy = rows.map((r) => /^\s*[✻✶✽✢✳·*]\s+(\S.*?…)\s*(?:\((.*)\))?\s*$/.exec(r)).filter(Boolean).pop();
  const opt = (i) => /^\s*(?:❯\s*)?(\d+)\.\s+(.*\S)/.exec(rows[i]), cur = rows.findIndex((r) => /^\s*❯\s*\d+\.\s/.test(r));
  let menu = null;
  if (cur >= 0) {
    const c = +opt(cur)[1], at = new Map([[c, cur]]);
    for (let i = cur - 1, n = c - 1; i >= 0 && n >= 1; i--) if (+opt(i)?.[1] === n) at.set(n--, i);
    for (let i = cur + 1, n = c + 1; i < rows.length; i++) if (+opt(i)?.[1] === n) at.set(n++, i);
    const top = at.get(1);
    if (at.size >= 2 && top != null) menu = { cur: c, opts: [...at].sort((x, y) => x[0] - y[0]).map(([n, i]) => ({ n, label: opt(i)[2] })),
      ask: rows.slice(Math.max(0, top - 6), top).map((r) => r.replace(/[│╭╮╰╯─]/g, '').trim()).filter(Boolean).join('\n') };
  }

}
function drawLive(toEnd) {
  const el = $('#live');

  sent = sent.filter((s) => Date.now() - s.at < 600000); // ponytail: one the record never shows (some slash commands) goes after 10 min
  const { busy, menu } = term && !ended ? screen() : {}, took = busy && /(\d+h\s*)?(\d+m\s*)?\d+s/.exec(busy[2] ?? '')?.[0];
  const h = sent.map((s) => `<div class="hm user pending">${esc(s.text)}</div>`).join('') + (menu
    ? `<div class="ask">${menu.ask ? `<div class="q">${esc(menu.ask)}</div>` : ''}${menu.opts.map((o) =>
      `<button class="pick${o.n === menu.cur ? ' on' : ''}" data-pick="${o.n}">${o.n}. ${esc(o.label)}</button>`).join('')}
      <div class="row2"><button data-key="esc">取消</button><button data-key="term">去终端里操作</button></div></div>`
    : busy ? `<div class="busy"><i></i>${/compact/i.test(busy[1]) ? '正在压缩对话' : 'Claude 正在回复'}${took ? ' · ' + took : ''}</div>` : '');
  busyNow = !!busy && !menu; goMode();

}
$('#hist').addEventListener('click', (e) => {
  const p = e.target.closest('[data-pick]'), k = e.target.closest('[data-key]');
  if (p) { // to that option with the arrow keys, then Enter: works for any of Claude's menus

    if (!m) return;
    const d = +p.dataset.pick - m.cur;
    for (let i = 0; i < Math.abs(d); i++) input(d > 0 ? '\x1b[B' : '\x1b[A');

});
// enough Markdown for Claude's replies: code blocks, tables (kept monospace), inline code, bold, headings
function md(t) {
  return esc(t).split(/```[^\n]*\n?/).map((p, i) => i % 2 ? `<pre>${p.replace(/\n$/, '')}</pre>`
    : p.replace(/((?:^\|.*\n?)+)/gm, '<div class="mono">$1</div>').replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4} +(.*)$/gm, '<b class="h">$1</b>')).join('');
}
$('#back').onclick = closeTerm;
// 结束: the conversation's Claude exits, as Ctrl+C in its terminal does. Pressed again until it's gone (at most 4, 0.6 s
// apart): the first one may only stop an answer, clear what's typed or close a question. Its record stays.
$('#end').onclick = async () => {
  if (!key || ended || !confirm('结束这个对话？\n和在终端里按 Ctrl+C 一样，Claude 会退出，电脑上它的窗口也会关掉。对话记录会保留，之后可以从列表里接着聊。')) return;
  for (let k = 0; k < 4 && !ended; k++) { input('\x03'); await new Promise((ok) => setTimeout(ok, 600)); }
  setTimeout(() => { if (!ended) toast('还没结束，可以再点一次，或者去终端里看看'); }, 2000);
};

// 换账号继续: the open conversation goes on with the account picked here. While it answers, it can wait for the end of
// the answer or stop now; nothing is sent, it waits for you there. The service does it (/api/switch) and the page
// follows: one running in the service comes back as event switched, one in a window on the computer as a new Claude in
// the same tab, found by asking for the conversation until it runs under another key.
let switching = 0; // the account it's going to, while it goes
$('#swap').onclick = () => {
  const s = state?.sessions.find((x) => x.id === histId), accts = state?.usage?.accounts ?? [], rec = state?.usage?.rec;
  if (!histId || !s) return toast('这个对话还没有消息，不用换账号');
  if (accts.length < 2) return toast('只有一个账号');
  let acct = rec != null && rec !== s.acct ? rec + 1 : (s.acct + 1) % accts.length + 1, now = false;
  const draw = () => {
    $('#sheetIn').innerHTML = `<b style="font-size:17px">换账号继续</b><div class="m" style="margin-top:4px">${esc(s.title)}</div>
      <div class="m" style="margin-top:14px">换到</div><div class="opts">${accts.map((a, i) => `<button class="opt ${acct === i + 1 ? 'on' : ''}" data-a="${i + 1}"${i === s.acct ? ' disabled' : ''}>
        账号 ${i + 1}<small>${i === s.acct ? '当前' : a.err ? '读不到额度' : a.runway > 0 ? `可用 ${a.runway}h` : '已用满'}${rec === i && i !== s.acct ? ' · 推荐' : ''}</small></button>`).join('')}</div>
      ${busyNow ? `<div class="m">它正在回答</div><div class="opts"><button class="opt ${now ? '' : 'on'}" data-now="">答完再换</button><button class="opt ${now ? 'on' : ''}" data-now="1">立即换</button></div>` : ''}
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" id="cancel" style="flex:1">取消</button><button class="btn primary" id="swapGo" style="flex:2">换到账号 ${acct}</button></div>`;
    document.querySelectorAll('[data-a]').forEach((b) => (b.onclick = () => { acct = +b.dataset.a; draw(); }));
    document.querySelectorAll('[data-now]').forEach((b) => (b.onclick = () => { now = !!b.dataset.now; draw(); }));
    $('#cancel').onclick = () => $('#sheet').classList.remove('on');
    $('#swapGo').onclick = async () => {
      $('#sheet').classList.remove('on');
      try {
        const r = await post('/api/switch', { id: histId, acct, now, cols: term?.cols, rows: term?.rows });
        switching = acct;
        if (r.key) { ({ key, kind } = r); switched(); connect(); return; }
        toast(busyNow && !now ? `这一轮答完后，换到账号 ${acct} 接着` : `正在换到账号 ${acct}…`, 4000);
        if (r.window) follow();

    };

};
function switched() {
  const s = state?.sessions.find((x) => x.id === histId);
  $('#termSub').textContent = `${s?.cwd ?? ''} · 已换到账号 ${switching}`;
  toast(`已换到账号 ${switching}`); switching = 0;
}
// one in a window: asked for again every 2 s, its old Claude still answering included, until it runs under another key
async function follow() { // ends with the switch, or when the terminal closes (switching cleared)
  const was = key;
  while (switching && term) {
    await new Promise((ok) => setTimeout(ok, 2000));
    if (!switching || !term) return;
    try {
      const r = await post('/api/open', { id: histId, live: true, cols: term.cols, rows: term.rows });
      if (r.key !== was) { ({ key, kind } = r); switched(); return connect(); }
    } catch {} // between the two Claudes: none runs it for a moment
  }
}
function sizeFont() { // a window of fixed size (the computer's, or another screen's): a font that shows all of it
  const s = $('#screen'), x = s.querySelector('.xterm-screen');
  for (let i = 0; i < 3 && x.offsetWidth; i++) { // measured as drawn; the padding and the terminal's scroll bar left out
    const k = Math.min((s.clientWidth - 26) / x.offsetWidth, (s.clientHeight - 10) / x.offsetHeight);
    const f = Math.max(5, Math.min(FONT, Math.floor(term.options.fontSize * k)));
    if (f === term.options.fontSize) break;
    term.options.fontSize = f;
  }
}
async function openTerm(body, title, sub) {
  $('#termTitle').textContent = title; $('#termSub').textContent = sub; $('#gone').style.display = 'none';
  $('#term').classList.add('on'); $('#screen').innerHTML = '';
  mine = ptySize = key = null; switching = 0;
  histId = body.id ?? null; histEnd = histOldest = null; histNow = false; histGen++; sent = []; liveHtml = ''; $('#hist').innerHTML = '';

// The live stream. It is opened again when it goes quiet (a computer waking up, a phone back from the

async function connect(again) {

// back to the list: what this conversation notified while you were in it, you've seen (the island drops it too)
function closeTerm() {

  ended = false; fails = 0; sent = []; busyNow = false; switching = 0; $('#term').classList.remove('on', 'hist');

window.addEventListener('resize', () => { if (!term || !key) return; if (kind === 'pc') sizeFont(); else claim(); });
// back to this screen (switched apps, picked the phone up): it takes the size again
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !key) return;
  if (stale(25000)) connect(true); else claim(); // back after a while: the stream likely died meanwhile
});
window.addEventListener('focus', () => { if (key) claim(); });

document.querySelectorAll('nav button').forEach((b) => (b.onclick = () => { tab = b.dataset.tab; history.replaceState(null, '', '#' + tab); if (tab === 'tokens') tokens = null; render(); }));
load();
setInterval(() => { if (!term && document.visibilityState === 'visible' && tab !== 'tokens') load(); }, 10000);
