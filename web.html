<script>
// the look, 跟随系统 (the default) / 亮色 / 暗色, kept in this browser; set before anything is drawn (no dark flash)
const LOOK = matchMedia('(prefers-color-scheme: light)');
function look() {
  let v = null; try { v = localStorage.getItem('cm-look'); } catch {}
  const light = v ? v === 'light' : LOOK.matches;
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  document.querySelector('meta[name=theme-color]').content = light ? '#f8f8f8' : '#181818';
  return v ?? 'auto';
}
look(); LOOK.addEventListener('change', look);
// opened from the home screen (iOS says so itself; the display-mode query may not match a page without a manifest)
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('app');

  #app.noButler #act .logo { display: none; } /* the 管家 switched off in 设置 (开发功能) */
  #app.butler #act .logo { background: var(--tint); }
  #app.butler #act button[data-side] { visibility: hidden; } /* a place of its own: out of it only by the spark (their places kept: the spark stays put) */
  /* held to go in or out: a ring fills round the spark (let go early and it empties) */

  #act .logo .sp { position: relative; display: grid; place-items: center; }
  /* the 管家 answered you (or asks you), its pane out of sight: a red dot on its icon, and on 「← 回到管家」 */
  #act .logo.new .sp::after, #peekBar .back.new::after { content: ''; position: absolute; top: -3px; right: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  #act .logo .ring { position: absolute; left: -8px; top: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); pointer-events: none; overflow: visible; }
  #act .logo .ring circle { fill: none; stroke: #d97757; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; opacity: 0; }
  #act .logo.hold .ring circle { opacity: 1; animation: holdRing .8s linear forwards; }
  @keyframes holdRing { to { stroke-dashoffset: 0; } }
  .spark { display: block; width: 100%; height: 100%; }

  .mk { flex: none; display: inline-block; width: 13px; height: 13px; vertical-align: -2px; margin-right: 5px; }

  /* a row waiting on you (orange) or answered and not looked at (green), as a tab marks it; on a folded folder too */

  /* a conversation's menu: by the mouse on a computer, a sheet's rows on a phone; what a running one can't, dimmed with why */
  #cmenu { position: fixed; z-index: 25; min-width: 200px; padding: 4px; border-radius: 8px; background: var(--pop); border: 1px solid var(--popB); box-shadow: 0 8px 24px var(--shadow); }

  .desk .acct .today b { color: var(--orange); }

  .desk .cost .pill { justify-self: start; } .desk .cost b { text-align: right; color: var(--fgHi); }
  #deskCost .m { padding: 6px 6px 0; font-size: 12px; color: var(--fg2); }
  #deskCost .sub { padding: 6px 6px 2px; font-size: 12px; color: var(--fg3); }
  #deskAcct .tot { padding: 0 6px 2px; font-size: 11.5px; color: var(--fg2); }
  /* quick questions over the 管家's input box */
  .send .quick { display: flex; gap: 6px; padding: 0 2px 6px; overflow-x: auto; scrollbar-width: none; }
  .send .quick button { flex: none; font-size: 12px; padding: 3px 10px; border-radius: 12px; border: 1px solid var(--cardB); background: var(--bg); color: var(--fg2); }
  @media (hover: hover) { .send .quick button:hover { color: var(--fgHi); border-color: var(--accent); } .desk .ev[data-open]:hover { background: var(--hover); } }
  #deskR { display: none; width: var(--deskRW, clamp(250px, 17vw, 380px)); flex: none; flex-direction: column; gap: 18px; overflow: auto; padding: 16px 14px; background: var(--bar); }
  @media (min-width: 1280px) { #app.butler #deskR { display: flex; } }
  .desk .acct { padding: 8px 6px 4px; }
  .desk .acct + .acct { border-top: 1px solid var(--border); }
  .desk .ah { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .desk .ah b { font-size: 13px; color: var(--fgHi); }
  .desk .acct .gauge { padding: 0 0 6px; }
  .desk .acct .m { font-size: 12px; color: var(--fg3); }
  /* a conversation looked at in its place: 「← 回到管家」 over it, the 管家's own things put away meanwhile */
  #peekBar { display: none; flex: none; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #butler.peeking #peekBar { display: flex; }
  #butler.peeking #asks, #butler.peeking > .hint { display: none !important; }
  #peekBar .back { position: relative; flex: none; padding: 3px 10px; border-radius: 6px; background: var(--btn); color: var(--fgHi); }
  #peekBar .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg2); }
  @media (hover: hover) { #peekBar .back:hover { background: var(--btnH); } }
  /* the others' questions, above it: answered here, or opened */
  #asks { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 0; max-height: 50%; overflow: auto; flex: none; }
  #asks:empty { display: none; }
  #asks .from { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg2); padding: 0 2px 2px; }
  #asks .from b { color: var(--fgHi); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #asks .from i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  #asks .from .open { margin-left: auto; flex: none; color: var(--link); }
  .hint .bt { font-size: 18px; font-weight: 600; color: var(--fgHi); margin-top: -6px; }

  /* a conversation: where it is, the record (对话) or the terminal (终端), the input */
  .pane { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .pane.on { display: flex; }
  .crumbs { height: 30px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 14px; font-size: 12px; color: var(--fg2); border-bottom: 1px solid var(--border); }
  .crumbs .path { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .crumbs .path b { font-weight: 400; color: var(--fg); }
  .crumbs .dim { color: var(--fg3); }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 7px; padding: 1px; flex: none; margin-right: 2px; }
  .seg button { padding: 1px 9px; border-radius: 5px; font-size: 12px; color: var(--fg2); }
  .seg button.on { background: var(--sel); color: var(--fgHi); }
  .notice { display: none; align-items: center; gap: 10px; padding: 6px 14px; font-size: 12.5px; }
  .pane.gone .notice, .pane.idle .notice { display: flex; }
  .pane.gone .notice { background: rgba(248,81,73,.1); color: var(--errFg); }
  .pane.idle .notice { background: var(--bar); color: var(--fg2); }
  .notice span { flex: 1; }
  .screen { flex: 1; min-height: 0; overflow: auto; background: var(--term); position: relative; }
  /* a window on the computer, as text over its (hidden) terminal: the page's font, rows wrapping */
  .screen .txt { display: none; position: absolute; inset: 0; z-index: 1; overflow: auto; padding: 8px 12px 14px; background: var(--term); color: #cccccc;
    font-family: "SF Mono", Menlo, "Cascadia Mono", Consolas, "PingFang SC", "Microsoft YaHei", monospace; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; cursor: text; }
  .screen.txtmode .txt { display: block; }
  .screen.txtmode { overflow: hidden; } /* the hidden terminal, a big window's size, would scroll it */
  .screen.txtmode .xterm { opacity: 0; } /* still there: the keys go to it */
  .screen .txt > div { min-height: 1.4em; }
  .screen .txt > .hr { min-height: 0; margin: .55em 0; border-top: 1px solid #444; }
  .screen .xterm { padding: 6px 2px 4px 10px; } /* on the terminal itself: the fit add-on subtracts it */
  .screen .xterm-viewport { background: var(--term) !important; } /* xterm.css paints it black; the theme colors only what's inside */
  .msgs { flex: 1; min-height: 0; overflow-y: auto; display: none; padding: 12px 20px 18px; }
  .pane.hist .msgs { display: block; }
  .pane.hist .screen, .pane.hist .keys { display: none; }
  .col { max-width: 1200px; margin: 0 auto; /* wide: your messages out to the right, Claude's to the left; capped near 80 Chinese characters a line (1600 px ran past 100, hard to read), room enough for code and tables */ display: flex; flex-direction: column; gap: 10px; }
  .hOld, .hNew, .live { display: contents; } /* their messages sit in the column's flow */
  .hm { white-space: pre-wrap; word-break: break-word; font-size: 15px; line-height: 1.65; color: var(--msg); } /* the conversation a size up from the frame (13px), for reading */
  .hm .katex { font-size: 1.05em; white-space: normal; } /* a formula's own spacing, not the message's pre-wrap */
  .hm .katex-display { margin: 4px 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; } /* a wide one scrolls, on a phone too */
  .hm.user { align-self: flex-end; max-width: 85%; margin-top: 14px; background: var(--accentBg); color: var(--fgHi); border-radius: 8px 8px 2px 8px; padding: 7px 12px; }
  /* on your side but not your words: the service waking the 管家, a command, what the 管家 typed, a thing handed to it */
  .hm.user .lab { display: block; font-size: 11px; font-weight: 600; margin-bottom: 2px; color: var(--fg2); }
  .hm.user.sys { align-self: center; max-width: min(92%, 680px); border-radius: 10px; background: color-mix(in srgb, var(--orange) 8%, transparent); border: 1px dashed color-mix(in srgb, var(--orange) 40%, transparent); color: var(--fg2); font-size: 12.5px; }
  .hm.user.sys .lab { color: var(--orange); }
  .hm.user.cmd { align-self: center; margin-top: 8px; padding: 2px 8px; background: none; color: var(--fg3); font: 12px/1.5 var(--mono); }
  .hm.user.byb { background: color-mix(in srgb, #d97757 14%, var(--bg)); } .hm.user.byb .lab { color: #d97757; }
  .hm.user.pending { opacity: .5; }
  .hm.long:not(.open) .clip { max-height: 16.5em; overflow: hidden; -webkit-mask: linear-gradient(#000 55%, transparent); mask: linear-gradient(#000 55%, transparent); } /* 10 lines: a long message of yours, a huge answer */
  .hm .more { display: block; margin-top: 4px; font-size: 12.5px; color: var(--link); }
  .hm .more::after { content: '展开全部'; } .hm.open .more::after { content: '收起'; }
  .hm.tool { font: 12.5px/1.5 var(--mono); color: var(--fg3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hm.tool::before { content: '● '; color: var(--green); }
  .hm.note { align-self: center; font-size: 12px; color: var(--fg3); }
  .hm.tm { margin-top: 12px; font-size: 11.5px; } /* the time over a message of yours, after a pause */
  .hm.tm + .hm.user, .hm.tm + .hm.img { margin-top: 0; }
  .hm a { color: var(--link); text-decoration: none; } .hm a:hover { text-decoration: underline; }
  /* copy: a code block's at its top right, an answer's under it (on a computer when the mouse is over it) */
  .cpy { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; color: var(--fg3); }
  .cpy svg { width: 15px; height: 15px; }
  .hm .pw { position: relative; }
  .hm .pw .cpy { position: absolute; top: 9px; right: 5px; background: var(--bar); }
  .hm.claude > .cpy { margin: 2px 0 -10px -5px; }
  .hm.sub > .cpy { display: none; }
  @media (hover: hover) { .cpy:hover { color: var(--fg); background: var(--tint); } .hm .pw .cpy:hover { background: var(--hover); }
    .hm .pw:not(:hover) .cpy, .hm.claude:not(:hover) > .cpy { opacity: 0; } }
  .hm pre, .hm .mono { font: 13px/1.5 var(--mono); background: var(--bar); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: pre; margin: 4px 0; }
  .hm .tbl { overflow-x: auto; margin: 4px 0; } /* sideways only when even wrapped it can't fit (a phone, many columns) */
  .hm table { border-collapse: collapse; white-space: normal; font-size: .95em; line-height: 1.55; }
  .hm th, .hm td { border: 1px solid var(--cellB); padding: 5px 10px; text-align: left; vertical-align: top; min-width: 4.5em; }
  .hm th { background: var(--bar); color: var(--fgHi); font-weight: 600; white-space: nowrap; }
  .hm code { font: .92em var(--mono); background: var(--tint); border-radius: 3px; padding: 1px 4px; }
  .hm .h { font-size: 1.08em; color: var(--fgHi); }
  .hm.done { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--green); margin: 2px 0 12px; }
  .hm.done::after { content: ''; flex: 1; height: 1px; background: var(--border); } /* the turn ends here */
  .who { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--fg2); margin-top: 2px; padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  .who .took { font-weight: 400; color: var(--green); margin-left: 6px; }
  .who .spark { width: 16px; height: 16px; color: #d97757; }
  .who .gm { width: 15px; height: 15px; color: var(--gpt); } .who .gm svg { display: block; width: 100%; height: 100%; } /* a GPT one's replies: OpenAI's mark */
  /* a turn: Claude's tool calls in a row folded into one line (tap to see each); the end of the answer marked */
  details.tools summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 2px; font-size: 13px; color: var(--fg2);
    padding: 3px 10px 3px 4px; border-radius: 6px; background: var(--tint); }
  @media (hover: hover) { details.tools summary:hover { color: var(--fg); } }
  details.tools > div { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 4px 7px; padding-left: 11px; border-left: 2px solid var(--border); }
  .hm.sub { font-size: 13.5px; line-height: 1.6; color: var(--fg2); } /* Claude's words on the way, inside 过程 */
  /* under the messages, live: what you sent (faded until the record has it), Claude at work, a menu to pick from */
  .busy { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--orange); }
  .busy i { width: 7px; height: 7px; border-radius: 4px; background: var(--orange); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  div.ask { background: var(--bar); border: 1px solid var(--cardB); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; } /* the card: a waiting one's dot, tab × and 提示 ! carry ask too */
  .ask .head { align-self: flex-start; font-size: 11px; color: var(--fg2); background: var(--tint); border-radius: 9px; padding: 1px 8px; }
  .ask .q { white-space: pre-wrap; font-size: 14px; font-weight: 600; color: var(--fgHi); padding: 0 2px 4px; }
  .ask .note { font-size: 13px; color: var(--fg2); padding: 0 2px; }
  .ask .pick { display: flex; align-items: flex-start; gap: 10px; text-align: left; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  .ask .pick .n { flex: none; display: grid; place-items: center; width: 20px; height: 20px; margin: -1px 0; border-radius: 50%; background: var(--tint); color: var(--fg2); font: 600 11px var(--ui); }
  .ask .pick.own { border-color: transparent; background: none; color: var(--fg2); padding: 4px 12px; } /* Claude's own: write in, chat */
  .ask .pick.on { background: var(--accentBg); border-color: var(--accent); }
  .ask .row2 { display: flex; gap: 6px; justify-content: flex-end; margin-top: 4px; }
  .ask .row2 button { font-size: 12px; padding: 3px 10px; border-radius: 6px; background: var(--btn); }
  .ask .row2 .push { margin-right: auto; }
  .ask .tabsQ { font-size: 12px; color: var(--fg2); padding: 0 2px; }
  .ask .pick small { display: block; margin-top: 2px; font-size: 12px; color: var(--fg2); }
  .ask .pick .box { flex: none; display: inline-grid; place-items: center; width: 16px; height: 16px; margin-top: 1px; border: 1.5px solid var(--fg2); border-radius: 4px; }
  .ask .pick .box.on { background: var(--accent); border-color: var(--accent); }
  .ask .pick .box.on::after { content: '✓'; color: #fff; font-size: 10px; line-height: 1; }
  .ask .hint2 { font-size: 12px; color: var(--accent); padding: 2px; }
  @media (hover: hover) { .ask .pick:hover { border-color: var(--accent); } .ask .pick.own:hover { color: var(--fg); background: var(--hover); } }
  .keys { display: flex; gap: 4px; padding: 6px; overflow-x: auto; border-top: 1px solid var(--border); scrollbar-width: none; flex: none; }
  .keys button { flex: 1 0 auto; min-width: 32px; background: var(--btn); border-radius: 6px; padding: 8px 4px; font-size: 13px; font-weight: 600; }
  /* the input: one box, the pictures waiting at its top, the text, a bar inside its bottom (pictures left, 发送 right) */
  .send { position: relative; width: 100%; max-width: 1240px; margin: 0 auto; padding: 6px 20px calc(14px + env(safe-area-inset-bottom)); flex: none; }
  /* scrolled up in the conversation: back to its end, over the input box */
  .toEnd { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); z-index: 2; padding: 4px 12px; border-radius: 14px; font-size: 12.5px; white-space: nowrap;
    color: var(--fgHi); background: var(--pop); border: 1px solid var(--popB); box-shadow: 0 2px 10px var(--shadow); }
  .toEnd.new { color: #fff; background: var(--accent); border-color: var(--accent); }
  .box { display: flex; flex-direction: column; background: var(--input); border: 1px solid var(--inputB); border-radius: 12px; box-shadow: 0 2px 10px var(--lift); }
  .bar { display: flex; align-items: flex-end; gap: 4px; padding: 5px; }
  .bar .pic { width: 32px; height: 32px; }
  .bar .pic svg { width: 18px; height: 18px; }
  .atts { display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 4px; }
  .atts:empty { display: none; }
  .att { position: relative; flex: none; }
  .att img { height: 56px; width: auto; max-width: 120px; border-radius: 6px; border: 1px solid var(--border); object-fit: cover; display: block; }
  .att button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 10px; background: var(--fg2); color: var(--bg); display: grid; place-items: center; }
  .att button svg { width: 12px; height: 12px; }
  .att.file { display: flex; align-items: center; gap: 6px; height: 56px; max-width: 200px; padding: 0 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bar); font-size: 12px; }
  .att.file > svg { width: 16px; height: 16px; flex: none; color: var(--fg2); }
  .att.file span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* a picture in the conversation: fixed height (nothing jumps as it loads), tap for the whole of it */
  .hm.img { align-self: flex-end; margin-top: 14px; line-height: 0; }
  .hm.img + .hm.img, .hm.img + .hm.user { margin-top: 0; } /* a message's pictures and its words together */
  .hm.img img { height: 200px; width: auto; max-width: 100%; min-width: 60px; border-radius: 8px; border: 1px solid var(--border); object-fit: cover; background: var(--bar); }
  .hm.img.pending { opacity: .5; }
  .box textarea { flex: 1; min-width: 0; font-size: 14px; line-height: 20px; resize: none; height: 32px; max-height: 200px; border: 0; border-radius: 0; background: none; padding: 6px 4px; }
  .go { width: 32px; height: 32px; flex: none; padding: 0; border-radius: 8px; display: grid; place-items: center; }
  .go svg { width: 18px; height: 18px; }
  .go .spin { border-color: #fff; border-right-color: transparent; }
  .go.stop, .go.stop:hover { background: var(--red); }
  input[type=text], textarea { width: 100%; background: var(--input); border: 1px solid var(--inputB); border-radius: 6px; color: var(--fg); font: inherit; padding: 8px 10px; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  /* a computer's browser: the real keyboard types straight into the terminal, so no key row, no input box there */
  @media (pointer: fine) { .keys { display: none; } .pane:not(.hist) .send { display: none; } }
  /* 16px at least: under that, an iPhone zooms the page in on typing and doesn't zoom back out (the terminal's
     hidden input box is a textarea too) */
  @media (pointer: coarse) { input, textarea { font-size: 16px !important; } }

  #status { height: 26px; flex: none; display: flex; align-items: center; padding: 0 6px; font-size: 12px; color: var(--fg2); }
  #status > * { display: flex; align-items: center; gap: 5px; padding: 0 9px; white-space: nowrap; height: 20px; border-radius: 5px; }
  #status .remote { color: var(--fg); }
  #status.off .remote { background: var(--red); color: #fff; }
  #status .remote svg { width: 14px; height: 14px; }
  #status .grow { padding: 0; }
  #status i { width: 8px; height: 8px; border-radius: 4px; }
  #status { overflow: hidden; }
  #here { display: flex; padding: 0; }
  #here > span { display: flex; align-items: center; gap: 5px; padding: 0 9px; white-space: nowrap; height: 20px; border-radius: 5px; }
  #here .where { margin-right: 4px; }
  #here b { font-weight: 600; }
  #here .where { color: #fff; font-weight: 600; } /* where it runs, bright: green a window on the computer, purple the web service */
  #here .where.pc { background: #16825d; }
  #here .where.pty { background: #8250df; }
  #here .ok { color: var(--green); } #here .warn { color: var(--orange); } #here .bad { color: var(--red); }
  #sAcct:hover { background: var(--tint); }

  /* a computer: as VS Code now, the activity bar, the side bar and each group of tabs a rounded card with a thin
     border, floating on the window's darker frame; the gaps between them are the sashes */
  @media (min-width: 760px) {
    html, body { background: var(--frame); }
    #app { padding: 6px 6px 0; }
    #act, #side, .group { border: 1px solid var(--cardB); border-radius: 10px; overflow: hidden; }
    #act { background: var(--bar); margin-right: 6px; padding-bottom: 6px; }
    #app.side #act { margin-right: 0; border-right: 0; border-radius: 10px 0 0 10px; }
    #side { background: var(--bar); }
    #app.side #side { border-left: 1px solid var(--border); border-radius: 0 10px 10px 0; }
    #editor { background: none; }
    .group { background: var(--bg); }
    .sash + .group { border-left-color: var(--cardB); }
    .sash { width: 6px; margin: 0; background: none !important; }
    .sash::after { content: ''; position: absolute; top: 12px; bottom: 12px; left: 2px; width: 2px; border-radius: 1px; transition: background .1s .1s; }
    .sash:hover::after, .sash.drag::after { background: var(--accent); }
    #butler { border: 1px solid var(--cardB); border-radius: 10px; overflow: hidden; }
    #app.butler #act { margin-right: 6px; border-right: 1px solid var(--cardB); border-radius: 10px; } /* on its own: the side bar's hidden */
    #desk, #deskR { border: 1px solid var(--cardB); border-radius: 10px; } /* the sashes between them: the gaps */
  }

  /* a phone: one group; the side bar over it under the tab strip, the activity bar at the bottom */
  @media (max-width: 759px) {
    html, body { font-size: 15px; }
    #status, .sash, .tabs .split, .row .aside { display: none !important; }
    #act { position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; width: auto; flex-direction: row; display: none; border: 0;
      border-top: 1px solid var(--border); background: var(--bar); padding-bottom: env(safe-area-inset-bottom); }
    #app.side #act { display: flex; }
    #app.butler #desk { display: none; }
    #app.butler #deskLine { display: flex; flex: none; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--fg2); overflow: hidden; white-space: nowrap; }
    #deskLine .mood { color: var(--fg); overflow: hidden; text-overflow: ellipsis; }
    #deskLine span { flex: none; }
    /* tapped: the 操作台 as a sheet from the bottom, over the 管家 (tapped outside, away) */
    #app.butler #deskLine { cursor: pointer; }
    #deskLine .mood { flex: 0 1 auto; min-width: 0; } #deskLine .more { margin-left: auto; color: var(--link); }
    #app.butler.deskOn #deskBg { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.5); }
    #app.butler.deskOn #desk { display: flex; position: fixed; z-index: 21; left: 0; right: 0; bottom: 0; width: auto; max-height: 85vh;
      padding-bottom: calc(18px + env(safe-area-inset-bottom)); border-radius: 12px 12px 0 0; border-top: 1px solid var(--popB); background: var(--pop); }
    /* 管家: the bottom bar's first item, and the bar stays while in it (but under the keyboard, typing) */
    #act .logo { margin: 0; } #act .logo .spark { width: 22px; height: 22px; } #act .logo .label { color: var(--fg3); }
    #app.butler #act { display: flex; } #app.butler #act .logo .label { color: var(--fg); }

// --- groups and tabs. Only each group's shown tab is live (its terminal's stream, its record read every second);

function makeGroup(ref, left) { // after ref (or before it: left), or last
  const g = { tabs: [], active: null, size: 1, el: document.createElement('div') };
  g.el.className = 'group blank';
  g.el.innerHTML = `<div class="tabs"><button class="ico list" title="对话列表">${svg(I.list)}</button><div class="strip"></div>

      <div class="btns"><button class="btn primary" data-new>＋ 新对话</button><button class="btn" data-shut>关闭这一栏</button></div></div></div>`;
  g.strip = g.el.querySelector('.strip'); g.body = g.el.querySelector('.body');
  g.el.addEventListener('pointerdown', () => { focusGroup(g); readShown(g); }, true);
  g.el.addEventListener('wheel', () => readShown(g), { capture: true, passive: true });
  g.el.querySelector('.list').onclick = () => { sideOn = !sideOn; drawSide(); save(); };
  g.el.querySelector('.split').onclick = () => split(g);

    const x = e.target.closest('[data-x]'), t = e.target.closest('[data-i]');
    if (x) closeConv(g.tabs[+x.dataset.x]); else if (t) activate(g, g.tabs[+t.dataset.i]);
  };
  g.strip.onmousedown = (e) => { if (e.button === 1) e.preventDefault(); }; // a middle click closes, doesn't scroll
  // a tab shows on the press (a mouse's left button), as in VS Code: a hand that moves a few pixels while pressing makes
  // it the start of a drag, and no click follows. Let go where it was, the tab stays put. Touch: on the tap, as before.
  g.strip.onpointerdown = (e) => {
    const t = e.target.closest('[data-i]');
    if (t && e.pointerType === 'mouse' && e.button === 0 && !e.target.closest('[data-x]')) activate(g, g.tabs[+t.dataset.i]);
  };
  g.strip.onauxclick = (e) => { const t = e.target.closest('[data-i]'); if (t && e.button === 1) closeConv(g.tabs[+t.dataset.i]); };
  g.strip.onwheel = (e) => { if (e.deltaY && !e.deltaX) { g.strip.scrollLeft += e.deltaY; e.preventDefault(); } }; // the wheel scrolls tabs sideways
  g.strip.ondragstart = (e) => {
    const t = e.target.closest('[data-i]');
    if (t) { drag = { conv: g.tabs[+t.dataset.i] }; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ''); }
  };
  // a tab or a side bar row dropped on a group: moved or opened there (on a tab: before it); on the conversation's left or
  // right quarter, docked there as a new group (while there's room for one), as VS Code does. A picture: to its input.
  const zone = (e) => {
    if (!drag || NARROW.matches || groups.length >= 3 || e.target.closest('.tabs')) return 'c';
    const r = g.body.getBoundingClientRect(), x = (e.clientX - r.left) / r.width;
    return x < 0.25 ? 'l' : x > 0.75 ? 'r' : 'c';
  };

    if (sending) { toast('上一条还在发，稍等一下'); return false; }
    if (busy) { toast('GPT 还在回答上一条，答完再发（也可以先停止）', 4000); return false; }
    sending = true;
    if (text == null) { line.value = ''; atts = []; grow(); drawAtts(); }
    $p('.live').innerHTML = files.filter((a) => !a.file).map((a) => `<div class="hm img pending"><img src="${a.url}" alt=""></div>`).join('')
      + files.filter((a) => a.file).map((a) => `<div class="hm user pending">附件：${esc(a.name)}</div>`).join('') + (v ? `<div class="hm user pending">${esc(v)}</div>` : '');
    hist.scrollTop = hist.scrollHeight;
    try {
      const r = await post('/api/oai/send', { id: c.id, text: v, paths: await Promise.all(files.map((a) => a.up)), ...opts });
      if (!c.id) { c.id = r.id; c.title = (v.split('\n')[0] || '新对话').slice(0, 40); save(); markRows(); if (c.g) drawTabs(c.g); }
      busy = true; since = Date.now(); sentWith = opts; sending = false;
      await refresh(); load(); // the list and the tab: it's answering
      return true;
    } catch (e) {
      $p('.live').innerHTML = '';
      if (text == null) { line.value = [v, line.value.trim()].filter(Boolean).join('\n'); atts = [...files.filter((a) => !a.failed), ...atts]; grow(); drawAtts(); }
      toast(e.message, 5000);
      return false;
    } finally { sending = false; goMode(); }
  }
  async function stop() { try { await post('/api/oai/stop', { id: c.id }); } catch (e) { toast(e.message, 4000); } await refresh(); load(); }
  go.onclick = () => (go.classList.contains('stop') ? stop() : send());

  c.sync = () => {
    const s = c.id && state?.sessions.find((x) => x.id === c.id);
    if (s) c.title = s.title;
    $p('.path').innerHTML = '<b>GPT 聊天</b> <span class="dim">· 用你的 OpenAI key，按用量计费</span>';
  };
  c.wake = () => {
    shown = true; el.classList.add('on'); readNote(c.id); c.sync(); goMode(); refresh();
    clearInterval(timer); timer = setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 2000);
  };
  c.sleep = () => { shown = false; el.classList.remove('on'); clearInterval(timer); readNote(c.id); };
  c.close = () => { c.closed = true; c.sleep(); el.remove(); };
  c.say = (t) => send(t);
  c.swap = () => toast('GPT 聊天不用换账号');
  c.where = () => null; c.focus = () => line.focus({ preventScroll: true }); c.back = () => { if (shown) refresh(); }; c.tick = c.claim = () => {};
  return c;
}
setInterval(() => shownConvs().forEach((c) => c.tick()), 10000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') shownConvs().forEach((c) => c.back()); });
window.addEventListener('focus', () => shownConvs().forEach((c) => c.claim())); // this screen takes the size again

// Messages into a box: your message and Claude's answer. How it got there, its tool calls and its words between them,
// folds into one line under your message, "过程：6 个操作（命令 3、读文件 2…）" (tap to see it all). Claude's words
// stay out until its next tool call: then they were on the way, not the answer, and fold in too; but not long ones
// (paragraphs, or over 280 characters): an answer, given before going on with something else. A turn over ends with
// how long it took. Added to piece by piece as the record grows: the box's end says where the turn is.
const KIND = { Bash: '命令', PowerShell: '命令', Read: '读文件', Edit: '改文件', Write: '改文件', NotebookEdit: '改文件', Grep: '搜索', Glob: '搜索',
  WebSearch: '查网页', WebFetch: '查网页', Agent: '子任务' };
// a message's time as a chat app writes it: 14:32 today, 昨天 14:32, 11月3日 14:32 this year, 2025年11月3日 14:32 before
function stamp(ms, now = Date.now()) {
  const d = new Date(ms), n = new Date(now), hm = d.toTimeString().slice(0, 5), md = `${d.getMonth() + 1}月${d.getDate()}日`;
  const days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return days === 0 ? hm : days === 1 ? `昨天 ${hm}` : d.getFullYear() === n.getFullYear() ? `${md} ${hm}` : `${d.getFullYear()}年${md} ${hm}`;
}
const dur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s} 秒` : s < 3600 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${Math.floor(s / 3600)} 小时 ${Math.floor(s / 60) % 60} 分`; };
// a message on your side that isn't your words, each its own way: the service waking the 管家 ([系统通知]), a command
// (the page's /model, /effort, or one you typed), what the 管家 typed into a conversation (the service knows: by), a
// thing handed to the 管家 from the 操作台
function userHtml(m, mark) {
  const t = m.text, [cls, lab, words] = t.startsWith('[系统通知]') ? ['sys', '系统通知', t.slice(6).trim()]
    : /^\/[a-z][\w-]*(\s|$)/.test(t) && !t.includes('\n') ? ['cmd', '', t]
    : m.by === 'butler' ? ['byb', '管家发的', t]
    : t.startsWith(HAND) ? ['', '交代给管家', t.slice(HAND.length)] : ['', '', t];
  // a long one (a paste, a ticket): its first lines fading out, 「展开全部」 under them; that button's words from the CSS,
  // out of the bubble's text (停止 compares it with what was sent)
  const long = cls !== 'cmd' && (words.split('\n').length > 12 || words.length > 800);
  return `<div class="hm user${cls ? ' ' + cls : ''}${long ? ' long' : ''}"${mark}>${lab ? `<span class="lab">${lab}</span>` : ''}${long
    ? `<div class="clip">${md(words)}</div><button class="more" data-more></button>` : md(words)}</div>`;
}
function addItems(box, items, gpt = false) { // gpt: a GPT one's, its replies headed GPT
  for (const m of items) {
    // Claude's answer begins (its words or its first tool call right after your message): marked as Claude's
    if ((m.role === 'claude' || m.role === 'tool') && box.lastElementChild?.matches('.hm.user, .hm.img'))
      box.insertAdjacentHTML('beforeend', gpt ? `<div class="who"><i class="gm">${OPENAI}</i>GPT</div>` : `<div class="who">${SPARK}Claude</div>`);
    // a message of yours on the line an earlier one hung on, nothing answering that one: it was stopped and taken back
    // (the record keeps it, Claude doesn't), so it goes (the service leaves such out of what it reads at once)
    const mark = m.u ? ` data-p="${esc(m.p)}" data-u="${esc(m.u)}"` : '';
    if (m.u && box.isConnected) {
      const col = box.closest('.col'), answers = [...col.querySelectorAll('.who, details.tools, .hm.claude, .hm.done')];
      for (const e of col.querySelectorAll(`[data-p="${CSS.escape(m.p)}"]:not([data-u="${CSS.escape(m.u)}"])`))
        if (!answers.some((x) => e.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING)) e.remove();
    }
    // a message of yours 5 minutes or more after what came before it here (or the first here): its time over it
    if ((m.role === 'img' || (m.role === 'user' && m.text)) && m.at && !(m.at - (box.$at ?? 0) < 300000)) box.insertAdjacentHTML('beforeend', `<div class="hm note tm">${stamp(m.at)}</div>`);
    if (m.at) box.$at = m.at;
    if (m.role === 'img') { box.insertAdjacentHTML('beforeend', `<a class="hm img" href="${esc(m.src)}" target="_blank"${mark}><img src="${esc(m.src)}" loading="lazy" alt="图片"></a>`); continue; }
    if (m.role === 'user' && !m.text) continue; // pictures only
    if (m.role === 'done') { // the turn over: how long it took, up front on the line that begins the answer
      let e = box.lastElementChild;
      while (e && !e.matches('.who, .hm.user, .hm.img')) e = e.previousElementSibling;
      const took = `✓ 回复完成 · 用时 ${dur(+m.text)}`;
      // ponytail: Claude going on by itself (a background task's news) and ending again: the line shows the last time
      if (e?.matches('.who')) { e.querySelector('.took')?.remove(); e.insertAdjacentHTML('beforeend', `<span class="took">${took}</span>`); }
      else box.insertAdjacentHTML('beforeend', `<div class="hm done">${took}</div>`); // its start not loaded (or no answer): at the end
      continue;
    }
    if (m.role !== 'tool') {
      // ponytail: an answer's Markdown kept on it for 复制, its words twice in the page; on demand from the record if a long one weighs on a phone
      // a huge one (the service once cut those at 20,000 characters) folded as a long message of yours is: whole, 复制 too
      const fold = m.role === 'claude' && m.text.length > 20000, body = m.role === 'claude' && (fold ? `<div class="clip">${md(m.text)}</div><button class="more" data-more></button>` : md(m.text));
      box.insertAdjacentHTML('beforeend', m.role === 'user' ? userHtml(m, mark) : m.role === 'claude'
        ? `<div class="hm claude${fold ? ' long' : ''}"${mark} data-raw="${esc(m.text)}">${body}<button class="cpy" data-copy title="复制这段回答">${svg(I.copy)}</button></div>`
        : `<div class="hm ${m.role}"${mark}>${m.role === 'note' ? esc(m.text) : md(m.text)}</div>`);
      continue;
    }
    const words = []; // Claude's words since the turn's 过程 (or its start): on the way after all
    let e = box.lastElementChild;
    while (e?.matches('.hm.claude') && !/\n\s*\n/.test(e.textContent) && e.textContent.length <= 280) { words.unshift(e); e = e.previousElementSibling; }
    let g = e?.matches('details.tools') ? e : null;
    if (!g) { g = document.createElement('details'); g.className = 'tools'; g.innerHTML = '<summary></summary><div></div>'; if (words[0]) words[0].before(g); else box.append(g); }
    const list = g.lastElementChild, n = {};
    for (const w of words) { w.classList.add('sub'); list.append(w); }
    list.insertAdjacentHTML('beforeend', `<div class="hm tool" data-k="${KIND[m.text.split(/\s/)[0]] ?? '其他'}">${esc(m.text)}</div>`);
    const tools = list.querySelectorAll('.hm.tool');
    for (const t of tools) n[t.dataset.k] = (n[t.dataset.k] ?? 0) + 1;
    g.firstElementChild.textContent = `过程：${tools.length} 个操作（${Object.entries(n).map(([k, v]) => `${k} ${v}`).join('、')}）`;
  }
}
// A picture made ready to send: a big one (a phone's photo) to 2000 px on its long side as JPEG, on white (Claude
// scales larger ones down anyway, and it goes up faster over a phone's network); a small PNG/JPEG/GIF/WebP as it is.
async function shrink(f) {
  if (/^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size < 1.5e6) return f;
  let b;
  try { b = await createImageBitmap(f); } catch { throw new Error('这张图片打不开'); }
  const k = Math.min(1, 2000 / Math.max(b.width, b.height)), cv = document.createElement('canvas');
  cv.width = Math.round(b.width * k); cv.height = Math.round(b.height * k);
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(b, 0, 0, cv.width, cv.height);
  return new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.9));
}
async function sendFile(f) { // a file as it is, its name kept (Claude reads it by its path): where it was saved
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': 'application/octet-stream', 'x-name': encodeURIComponent(f.name) }, body: f });
  const j = await r.json().catch(() => ({ err: r.status === 413 ? '文件太大了（最大 20 MB）' : `出错了（${r.status}）` }));
  if (!r.ok) throw new Error(j.err || r.status);
  return j.path;
}
async function upload(blob) { // to the computer: where it was saved there
  const r = await fetch('/api/upload', { method: 'POST', headers: { 'content-type': blob.type }, body: blob });
  const j = await r.json().catch(() => ({ err: r.status === 413 ? '图片太大了' : `出错了（${r.status}）` }));
  if (!r.ok) throw new Error(j.err || r.status);
  return j.path;
}

// enough Markdown for Claude's replies: code blocks, tables, inline code, bold, headings. A table drawn as one, its
// cells wrapping to the width as Claude Code's terminal draws it: rows of | cells |, the |---| line under the header
// (a \| in a cell is a |). Lines of | without that line aren't a table: kept as they are, monospace.
const table = (rows) => {
  const cells = rows.trim().split('\n').map((r) => r.trim().replace(/^\||\|$/g, '').replace(/\\\|/g, '\0').split('|').map((c) => c.trim().replace(/\0/g, '|')));
  if (!cells[1]?.every((c) => /^:?-+:?$/.test(c))) return `<div class="mono">${rows}</div>`;
  const [head] = cells.splice(0, 2);
  return `<div class="tbl"><table><thead><tr>${head.map((c) => `<th>${c}</th>`).join('')}</tr></thead>`
    + `<tbody>${cells.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
};
// Links, opened in a new tab: [words](address), or an address as it is, on the escaped text (an &amp; in it stays: the
// attribute reads it as &), up to a space, a tag, a quote, a backtick or Chinese text right after it; its sentence's end
// not in it, nor a ")" with no "(" for it in the address (a [words](address) one may hold one pair: a wiki page's).
// Last: an address in a `code` or **bold** is a link in it, and neither is cut across a link's markup. A formula's
// \0 mark ends an address (math is put back after links: KaTeX's own markup holds an http:// address)
const LINK = /\[([^\]\n]+)\]\((https?:\/\/(?:[^\s()<`\0]|\([^\s()<`\0]*\))+)\)|https?:\/\/(?:[^\s<&`\0\u3000-\u9fff\uff00-\uffef]|&amp;)+/g;
const anchor = (u, words) => `<a href="${u}" target="_blank" rel="noopener">${words}</a>`;
const link = (m, words, u) => {
  if (u) return anchor(u, words);
  let end = /[.,;:!?]*$/.exec(m)[0], bare = m.slice(0, m.length - end.length);
  while (bare.endsWith(')') && bare.split(')').length > bare.split('(').length) { bare = bare.slice(0, -1); end = ')' + end; } // "(see https://…)"
  return anchor(bare, bare) + end;
};
// Math as Claude writes it, drawn by KaTeX: $$…$$ and \[…\] set apart, $…$ and \(…\) in the line (a $ before a digit or
// after a space doesn't end one: 「$5 和 $6」 stays money). Taken out before the markdown rules (its | and * aren't
// theirs) and put back drawn; inline code is stepped over, a code block never looked in. One KaTeX can't read shows in
// red as written (throwOnError: false); without KaTeX loaded, as written.
const MATH = /`[^`\n]+`|\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$(?=\S)([^$\n]*?[^$\s])\$(?!\d)/g; // no lookbehind: an older Safari fails to read the whole script on one
const tex = (s, block) => { try { return katex.renderToString(s, { displayMode: block, throwOnError: false }); } catch { return esc(block ? `$$${s}$$` : `$${s}$`); } };
function md(t) {
  return t.split(/```[^\n]*\n?/).map((p, i) => {
    if (i % 2) return `<div class="pw"><button class="cpy" data-copy title="复制">${svg(I.copy)}</button><pre>${esc(p.replace(/\n$/, ''))}</pre></div>`;
    const math = [];
    p = p.replace(MATH, (m, d1, d2, i1, i2) => (m[0] === '`' ? m : `\u0000${math.push([d1 ?? d2 ?? i1 ?? i2, d1 != null || d2 != null]) - 1}\u0000`));
    return esc(p).replace(/((?:^\|.*\n?)+)/gm, table).replace(/`([^`\n]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/^#{1,4} +(.*)$/gm, '<b class="h">$1</b>').replace(LINK, link)
      .replace(/\u0000(\d+)\u0000/g, (_, k) => tex(...math[k]));
  }).join('');
}
// 复制: a code block's code, or an answer as Claude wrote it (its Markdown). 展开全部 / 收起 a long message of yours
// (folded again, kept in sight)
document.addEventListener('click', (e) => {
  const m = e.target.closest('[data-more]')?.closest('.hm');
  if (m) { if (!m.classList.toggle('open')) m.scrollIntoView({ block: 'nearest' }); return; }
  const b = e.target.closest('[data-copy]');
  if (!b) return;
  const t = b.closest('.pw')?.querySelector('pre').textContent ?? b.closest('[data-raw]')?.dataset.raw ?? '';
  (navigator.clipboard?.writeText(t) ?? Promise.reject()).then(() => toast('已复制', 1200), () => toast('复制失败', 2000));
});

focusGroup(makeGroup());
drawSide();
load();
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 5000);
</script>
